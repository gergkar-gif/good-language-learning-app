<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parlour</title>
    <meta name="description" content="Parlour is your home for meaningful language learning. Learn with lessons. Read stories. Practise with purpose. Remember what matters.">
    <link rel="icon" type="image/svg+xml" href="assets/icons/favicon.svg">

    <link rel="stylesheet" href="styles/base.css?v=2026-09-14b">
    <link rel="stylesheet" href="styles/geometry.css?v=2026-09-14b">
    <link rel="stylesheet" href="styles/components.css?v=2026-09-14b">
    <link rel="stylesheet" href="styles/layout.css?v=2026-09-14b">
    <link rel="stylesheet" href="styles/utilities.css?v=2026-09-14b">
    <link rel="stylesheet" href="styles/verbs.css?v=2026-09-14b">
    <link rel="stylesheet" href="styles/workshop.css?v=2026-09-14b">
    <link rel="stylesheet" href="styles/study-plan.css?v=2026-09-14b">
    <script>
    (function() {
        try {
            var p = localStorage.getItem('parlour_theme') || 'system';
            var d = p === 'dark' || (p === 'system' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
            if (d) {
                document.documentElement.setAttribute('data-theme', 'dark');
            } else if (p === 'light') {
                document.documentElement.setAttribute('data-theme', 'light');
            }
        } catch(e) {}
    })();
    </script>
</head>
<body>

<div class="app">

    <!-- Contextual, rendered per section by engine/page-header.js -->
    <header class="page-header" id="page-header"></header>

    <!-- Labels match the page headers. The data-tab ids stay as they are â€”
         they key showTab, PageHeader and the tab sections. -->
    <nav class="nav" id="main-nav">
        <div class="nav-brand" onclick="showTab('home')">
            <span class="nav-brand-mark" aria-hidden="true">
                <svg viewBox="0 0 24 24" class="nav-brand-icon"><rect width="24" height="24" rx="5" class="brand-tile"/><rect x="4" y="3" width="16" height="18" class="brand-door"/><path d="M4 3 12 6v15l-8-3Z" class="brand-door"/><circle cx="10" cy="12" r="1.1" class="brand-knob"/></svg>
            </span>
            <span class="nav-brand-name">Parlour</span>
        </div>
        <div class="nav-items">
            <button class="active" data-tab="home" data-icon="home">Home</button>
            <button data-tab="learn" data-icon="lessons">Lessons</button>
            <button data-tab="reader" data-icon="library">Library</button>
            <button data-tab="drills" data-icon="workshop">Workshop</button>
            <button data-tab="review" data-icon="decks">Decks</button>
            <button data-tab="journey" data-icon="journey">Journey</button>
        </div>
        <div class="nav-footer">
            <div class="nav-footer-stats">
                <div class="nav-footer-streak" id="nav-streak"></div>
                <div class="nav-footer-xp" id="nav-xp"></div>
            </div>
            <button type="button" class="nav-theme-btn" id="nav-theme-toggle" aria-label="Toggle dark/light theme" title="Toggle dark/light theme">
                <span class="theme-toggle-icon" aria-hidden="true"><svg class="art icon" viewBox="0 0 24 24" role="presentation" aria-hidden="true" focusable="false"><path class="ink-line" d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79Z"/></svg></span>
                <span class="nav-theme-label">Dark theme</span>
            </button>
        </div>
    </nav>

    <main class="content">

        <!-- The landing section. Everything on it is drawn by engine/home.js. -->
        <section id="home" class="tab">
            <div id="home-root"></div>
        </section>

        <section id="learn" class="tab hidden">
            <div id="learn-content"></div>
        </section>

        <section id="reader" class="tab hidden">
            <div id="reader-root">
                <!-- Parlour | Saved | My Texts â€” engine/library.js owns switching -->
                <nav class="lt-subnav" id="lib-subnav">
                    <button class="lt-subnav-btn active" data-lib-tab="parlour">Parlour</button>
                    <button class="lt-subnav-btn" data-lib-tab="saved">Saved</button>
                    <button class="lt-subnav-btn" data-lib-tab="mytexts">My Texts</button>
                </nav>

                <div id="reader-library"></div>
                <div id="lib-saved" class="hidden"></div>
                <div id="lib-mytexts" class="hidden"></div>

                <!-- Shared reading view, for Parlour, Saved and My Texts alike -->
                <div id="reader-content" class="hidden"></div>
            </div>
        </section>

        <section id="drills" class="tab hidden">
            <div id="drills-root"></div>
        </section>

        <section id="review" class="tab hidden">
            <div id="review-root">

                <!-- Deck browser: lesson, topic and frequency decks, plus My Deck -->
                <div id="decks-root"></div>

                <!-- Review session, scoped to whichever deck was chosen -->
                <div id="review-session" class="hidden">
                    <button class="dk-back" onclick="endReviewSession()">â† All decks</button>
                    <p id="review-scope" class="dk-scope"></p>

                <!-- Today's three activities used to sit here as a stopgap.
                     They belong on Home, which is the screen that asks what
                     to do today, and engine/home.js draws them now. -->

                <!-- Stats bar -->
                <div class="review-stats">
                    <div class="review-stat">Due <strong id="due-count">0</strong></div>
                    <div class="review-stat">New <strong id="new-count">0</strong></div>
                    <div class="review-stat">Total <strong id="total-count">0</strong></div>
                    <button class="review-clear-btn" onclick="clearDeck()">Reset</button>
                </div>

                <!-- Which side of the card is shown first: recognition (Spanish
                     first) or production (English first). A study-style
                     preference, so it applies to every deck, not just the one
                     open right now. -->
                <div class="dk-direction" id="dk-direction-container">
                    <span id="dk-direction-es" class="dk-direction-label" onclick="setReviewDirection('es-en')" title="Spanish to English">Spanish</span>
                    <button id="dk-direction-toggle" class="geo-toggle" onclick="toggleReviewDirection()"
                        role="switch" aria-checked="false" aria-label="Toggle review direction (Spanish, English, Audio)">
                        <span class="geo-toggle-track"></span>
                        <span class="geo-toggle-shape geo-toggle-shape--off"></span>
                        <span class="geo-toggle-shape geo-toggle-shape--on"></span>
                    </button>
                    <span id="dk-direction-en" class="dk-direction-label" onclick="setReviewDirection('en-es')" title="English to Spanish">English</span>
                    <span id="dk-direction-audio" class="dk-direction-label" onclick="setReviewDirection('audio-en')" title="Audio-first listening flashcards">Audio</span>
                </div>

                <!-- Flip (self-rated recall) vs Type (typed recall, still
                     self-rated after Check reveals whether you got it) â€” a
                     study-style preference, same as direction above. -->
                <div class="dk-direction">
                    <span id="dk-mode-flip" class="dk-direction-label">Flip</span>
                    <button id="dk-mode-toggle" class="geo-toggle" onclick="toggleReviewMode()"
                        role="switch" aria-checked="false" aria-label="Type your answer instead of flipping the card">
                        <span class="geo-toggle-track"></span>
                        <span class="geo-toggle-shape geo-toggle-shape--off"></span>
                        <span class="geo-toggle-shape geo-toggle-shape--on"></span>
                    </button>
                    <span id="dk-mode-type" class="dk-direction-label">Type</span>
                </div>

                <!-- Empty state â€” reserved for opening Review with nothing due
                     to begin with. A session that actually reviewed something
                     shows #review-summary below instead; see showNextCard()
                     in engine/srs.js for the branch. -->
                <div id="review-empty" class="review-empty">
                    <div class="review-empty-icon"><span class="geo-circle geo-circle--outline geo--lg"></span></div>
                    <h3 class="review-empty-title">All caught up!</h3>
                    <p class="review-empty-text">No cards are due for review.</p>
                    <p class="review-empty-text">Read stories and tap words to add them to your deck.</p>
                </div>

                <!-- Session summary â€” built entirely in JS by
                     renderReviewSessionSummary() (engine/srs.js), same
                     pattern as the lesson-complete screen in
                     engine/lessons.js. -->
                <div id="review-summary" class="review-summary" style="display:none"></div>

                <!-- Flashcard -->
                <div id="review-card" class="review-card">
                    <div class="review-card-front">
                        <span id="review-context" class="review-card-type"></span>
                        <span id="review-front" class="review-card-word"></span>
                    </div>

                    <div id="review-answer" class="review-card-back">
                        <span id="review-back" class="review-card-translation"></span>
                    </div>

                    <div id="review-flip-actions" class="review-flip-actions">
                        <button id="show-answer-btn" class="review-show-btn" onclick="showAnswer()">Show Answer</button>
                        <button type="button" id="review-speak-btn" class="review-speak-btn" onclick="reviewSpeakWord(this)" title="Say the word out loud" aria-label="Speak answer">
                            <span class="review-speak-icon"><svg class="art icon" viewBox="0 0 24 24" role="presentation" aria-hidden="true" focusable="false"><rect class="ink-line" x="9" y="3" width="6" height="11" rx="3"/><path class="ink-line" d="M5 10a7 7 0 0 0 14 0"/><line class="ink-line" x1="12" y1="17" x2="12" y2="21"/><line class="ink-line" x1="8" y1="21" x2="16" y2="21"/></svg></span>
                            <span class="review-speak-label">Speak</span>
                        </button>
                    </div>
                    <div id="review-speak-feedback" class="review-speak-feedback hidden"></div>

                    <!-- Type mode: an input + Check stands in for Show Answer.
                         Checking still just reveals the card back and rating
                         buttons below — grading stays self-rated. -->
                    <div id="review-type-input" class="review-type-input hidden">
                        <div class="lsn-input-with-mic">
                            <input id="review-type-field" class="review-input" type="text"
                                placeholder="Type or speak answer" autocomplete="off" autocapitalize="off" spellcheck="false"
                                onkeydown="if(event.key==='Enter')checkTypedAnswer()">
                            <button type="button" class="lsn-mic-addon" onclick="typeof lessonInlineVoiceInput === 'function' && lessonInlineVoiceInput('#review-type-field', this)" aria-label="Speak to type" title="Speak to type">
                                <svg class="art icon" viewBox="0 0 24 24" role="presentation" aria-hidden="true" focusable="false"><rect class="ink-line" x="9" y="3" width="6" height="11" rx="3"/><path class="ink-line" d="M5 10a7 7 0 0 0 14 0"/><line class="ink-line" x1="12" y1="17" x2="12" y2="21"/><line class="ink-line" x1="8" y1="21" x2="16" y2="21"/></svg>
                            </button>
                        </div>
                        <button class="review-show-btn" onclick="checkTypedAnswer()">Check</button>
                    </div>

                    <!-- Times are placeholders: updateRatingLabels() rewrites
                         them per card, since intervals now depend on the card. -->
                    <div id="rating-buttons" class="review-ratings">
                        <button class="review-rate review-rate-again" onclick="rateCard('again')">
                            <span class="review-rate-label">Again</span>
                            <span class="review-rate-time">1m</span>
                            <span class="review-rate-hint" aria-hidden="true">1</span>
                        </button>
                        <button class="review-rate review-rate-hard" onclick="rateCard('hard')">
                            <span class="review-rate-label">Hard</span>
                            <span class="review-rate-time">1d</span>
                            <span class="review-rate-hint" aria-hidden="true">2</span>
                        </button>
                        <button class="review-rate review-rate-good" onclick="rateCard('good')">
                            <span class="review-rate-label">Good</span>
                            <span class="review-rate-time">1d</span>
                            <span class="review-rate-hint" aria-hidden="true">3</span>
                        </button>
                        <button class="review-rate review-rate-easy" onclick="rateCard('easy')">
                            <span class="review-rate-label">Easy</span>
                            <span class="review-rate-time">4d</span>
                            <span class="review-rate-hint" aria-hidden="true">4</span>
                        </button>
                    </div>
                </div>

                </div><!-- /review-session -->

            </div>
        </section>

        <section id="leveltest" class="tab hidden">
            <div id="leveltest-root"></div>
        </section>

        <section id="journey" class="tab hidden">
            <div id="journey-root"></div>
        </section>

        <section id="lesson-screen" class="tab hidden">
            <div id="lesson-root">

                <div class="lesson-header">
                    <button id="lesson-close-btn" class="lesson-close-btn" aria-label="Exit lesson" type="button">&larr;</button>

                    <div>
                        <h2 id="lesson-title"></h2>
                        <p id="lesson-subtitle"></p>
                    </div>

                    <button id="lesson-sound-btn" class="lesson-sound-btn" aria-label="Sound effects"></button>

                </div>

                <div id="lesson-content"></div>

                <div class="lesson-footer">
                    <button class="btn-back" id="lesson-back-btn" onclick="prevLessonStep()">&larr; Back</button>
                    <button class="btn-primary" id="lesson-next-btn">Continue &rarr;</button>
                </div>

            </div>
        </section>

        <!-- Time-based session (Learner model roadmap, step 5) â€” an
             alternative entry point from Home, not a standing nav tab, same
             convention as #lesson-screen/#leveltest above. All content is
             rendered dynamically by engine/studyPlanRunner.js. -->
        <section id="study-plan-screen" class="tab hidden">
            <div id="study-plan-activity"></div>
        </section>

    </main>

</div>

<!-- Verb list (global ALL_VERBS) -->
<script src="imports/verbs/verb-list.js?v=2026-09-14b"></script>

<script src="engine/speech.js?v=2026-09-14b"></script>

</body>
</html>
