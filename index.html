<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parlour</title>
    <meta name="description" content="Parlour is your home for meaningful language learning. Learn with lessons. Read stories. Practise with purpose. Remember what matters.">
    <link rel="icon" type="image/svg+xml" href="assets/icons/favicon.svg">

    <link rel="stylesheet" href="styles/base.css?v=2026-08-14c">
    <link rel="stylesheet" href="styles/geometry.css?v=2026-08-13d">
    <link rel="stylesheet" href="styles/components.css?v=2026-08-27i">
    <link rel="stylesheet" href="styles/layout.css?v=2026-08-25a">
    <link rel="stylesheet" href="styles/utilities.css?v=2026-08-13e">
    <link rel="stylesheet" href="styles/verbs.css?v=2026-08-18a">
    <link rel="stylesheet" href="styles/workshop.css?v=2026-08-27a">
</head>
<body>

<div class="app">

    <!-- Contextual, rendered per section by engine/page-header.js -->
    <header class="page-header" id="page-header"></header>

    <!-- Labels match the page headers. The data-tab ids stay as they are —
         they key showTab, PageHeader and the tab sections. -->
    <nav class="nav">
        <button class="active" data-tab="home" data-icon="home">Home</button>
        <button data-tab="learn" data-icon="lessons">Lessons</button>
        <button data-tab="reader" data-icon="library">Library</button>
        <button data-tab="drills" data-icon="workshop">Workshop</button>
        <button data-tab="review" data-icon="decks">Decks</button>
        <button data-tab="journey" data-icon="journey">Journey</button>
    </nav>

    <main class="content">

        <!-- The landing section. Everything on it is drawn by engine/home.js. -->
        <section id="home" class="tab">
            <div id="home-root"></div>
        </section>

        <section id="learn" class="tab hidden">
            <div id="learn-content"></div>
        </section>

        <section id="reader" class="tab hidden">
            <div id="reader-root">
                <!-- Parlour | Saved | My Texts — engine/library.js owns switching -->
                <nav class="lt-subnav" id="lib-subnav">
                    <button class="lt-subnav-btn active" data-lib-tab="parlour">Parlour</button>
                    <button class="lt-subnav-btn" data-lib-tab="saved">Saved</button>
                    <button class="lt-subnav-btn" data-lib-tab="mytexts">My Texts</button>
                </nav>

                <div id="reader-library"></div>
                <div id="lib-saved" class="hidden"></div>
                <div id="lib-mytexts" class="hidden"></div>

                <!-- Shared reading view, for Parlour, Saved and My Texts alike -->
                <div id="reader-content" class="hidden"></div>
            </div>
        </section>

        <section id="drills" class="tab hidden">
            <div id="drills-root"></div>
        </section>

        <section id="review" class="tab hidden">
            <div id="review-root">

                <!-- Deck browser: lesson, topic and frequency decks, plus My Deck -->
                <div id="decks-root"></div>

                <!-- Review session, scoped to whichever deck was chosen -->
                <div id="review-session" class="hidden">
                    <button class="dk-back" onclick="endReviewSession()">← All decks</button>
                    <p id="review-scope" class="dk-scope"></p>

                <!-- Today's three activities used to sit here as a stopgap.
                     They belong on Home, which is the screen that asks what
                     to do today, and engine/home.js draws them now. -->

                <!-- Stats bar -->
                <div class="review-stats">
                    <div class="review-stat">Due <strong id="due-count">0</strong></div>
                    <div class="review-stat">New <strong id="new-count">0</strong></div>
                    <div class="review-stat">Total <strong id="total-count">0</strong></div>
                    <button class="review-clear-btn" onclick="clearDeck()">Reset</button>
                </div>

                <!-- Which side of the card is shown first: recognition (Spanish
                     first) or production (English first). A study-style
                     preference, so it applies to every deck, not just the one
                     open right now. -->
                <div class="dk-direction">
                    <span id="dk-direction-es" class="dk-direction-label">Spanish</span>
                    <button id="dk-direction-toggle" class="geo-toggle" onclick="toggleReviewDirection()"
                        role="switch" aria-checked="false" aria-label="Show English side first">
                        <span class="geo-toggle-track"></span>
                        <span class="geo-toggle-shape geo-toggle-shape--off"></span>
                        <span class="geo-toggle-shape geo-toggle-shape--on"></span>
                    </button>
                    <span id="dk-direction-en" class="dk-direction-label">English</span>
                </div>

                <!-- Flip (self-rated recall) vs Type (typed recall, still
                     self-rated after Check reveals whether you got it) — a
                     study-style preference, same as direction above. -->
                <div class="dk-direction">
                    <span id="dk-mode-flip" class="dk-direction-label">Flip</span>
                    <button id="dk-mode-toggle" class="geo-toggle" onclick="toggleReviewMode()"
                        role="switch" aria-checked="false" aria-label="Type your answer instead of flipping the card">
                        <span class="geo-toggle-track"></span>
                        <span class="geo-toggle-shape geo-toggle-shape--off"></span>
                        <span class="geo-toggle-shape geo-toggle-shape--on"></span>
                    </button>
                    <span id="dk-mode-type" class="dk-direction-label">Type</span>
                </div>

                <!-- Empty state -->
                <div id="review-empty" class="review-empty">
                    <div class="review-empty-icon"><span class="geo-circle geo-circle--outline geo--lg"></span></div>
                    <h3 class="review-empty-title">All caught up!</h3>
                    <p class="review-empty-text">No cards are due for review.</p>
                    <p class="review-empty-text">Read stories and tap words to add them to your deck.</p>
                </div>

                <!-- Flashcard -->
                <div id="review-card" class="review-card">
                    <div class="review-card-front">
                        <span id="review-context" class="review-card-type"></span>
                        <span id="review-front" class="review-card-word"></span>
                    </div>

                    <div id="review-answer" class="review-card-back">
                        <span id="review-back" class="review-card-translation"></span>
                    </div>

                    <button id="show-answer-btn" class="review-show-btn" onclick="showAnswer()">Show Answer</button>

                    <!-- Type mode: an input + Check stands in for Show Answer.
                         Checking still just reveals the card back and rating
                         buttons below — grading stays self-rated. -->
                    <div id="review-type-input" class="review-type-input hidden">
                        <input id="review-type-field" class="review-input" type="text"
                            placeholder="Type your answer" autocomplete="off" autocapitalize="off" spellcheck="false"
                            onkeydown="if(event.key==='Enter')checkTypedAnswer()">
                        <button class="review-show-btn" onclick="checkTypedAnswer()">Check</button>
                    </div>

                    <!-- Times are placeholders: updateRatingLabels() rewrites
                         them per card, since intervals now depend on the card. -->
                    <div id="rating-buttons" class="review-ratings">
                        <button class="review-rate review-rate-again" onclick="rateCard('again')">
                            <span class="review-rate-label">Again</span>
                            <span class="review-rate-time">1m</span>
                        </button>
                        <button class="review-rate review-rate-hard" onclick="rateCard('hard')">
                            <span class="review-rate-label">Hard</span>
                            <span class="review-rate-time">1d</span>
                        </button>
                        <button class="review-rate review-rate-good" onclick="rateCard('good')">
                            <span class="review-rate-label">Good</span>
                            <span class="review-rate-time">1d</span>
                        </button>
                        <button class="review-rate review-rate-easy" onclick="rateCard('easy')">
                            <span class="review-rate-label">Easy</span>
                            <span class="review-rate-time">4d</span>
                        </button>
                    </div>
                </div>

                </div><!-- /review-session -->

            </div>
        </section>

        <section id="leveltest" class="tab hidden">
            <div id="leveltest-root"></div>
        </section>

        <section id="journey" class="tab hidden">
            <div id="journey-root"></div>
        </section>

        <section id="lesson-screen" class="tab hidden">
            <div id="lesson-root">

                <div class="lesson-header">
                    <button id="lesson-close-btn">←</button>

                    <div>
                        <h2 id="lesson-title"></h2>
                        <p id="lesson-subtitle"></p>
                    </div>

                    <button id="lesson-sound-btn" class="lesson-sound-btn" aria-label="Sound effects"></button>

                </div>

                <div id="lesson-content"></div>

                <div class="lesson-footer">
                    <button class="btn-back" id="lesson-back-btn" onclick="prevLessonStep()">&larr; Back</button>
                    <button class="btn-primary" id="lesson-next-btn">Continue →</button>
                </div>

            </div>
        </section>

    </main>

</div>

<!-- Verb list (global ALL_VERBS) -->
<script src="imports/verbs/verb-list.js?v=2026-08-09"></script>

<script src="engine/lang.js?v=2026-08-15a"></script>

<script src="engine/art.js?v=2026-08-27b"></script>
<script src="engine/sound.js?v=2026-08-27a"></script>
<script src="engine/geo.js?v=2026-08-13d"></script>
<script src="engine/page-header.js?v=2026-08-18a"></script>

<script src="engine/verbs/leaderboard.js?v=2026-08-27a"></script>
<script src="engine/verbs/table.js?v=2026-08-09"></script>
<script src="engine/verbs/speed.js?v=2026-08-27a"></script>
<script src="engine/verbs.js?v=2026-08-14b"></script>

<!-- Engine: grammar driller submodules (order matters) -->
<script src="engine/drills/grammar-runner.js?v=2026-08-27b"></script>
<script src="engine/drills/grammar.js?v=2026-08-27a"></script>

<!-- Engine: translation driller submodules -->
<script src="engine/drills/translation-runner.js?v=2026-08-13"></script>
<script src="engine/drills/translation.js?v=2026-08-19a"></script>

<!-- Engine: vocabulary driller (reuses GrammarRunner, loaded above) -->

<!-- Engine: listening driller submodules (depends on Speech, loaded earlier) -->
<script src="engine/drills/listening-runner.js?v=2026-08-15a"></script>
<script src="engine/drills/listening.js?v=2026-08-19a"></script>

<!-- Engine: Hungarian-specific drillers (depend on HungarianMorphology, Lexicon, GrammarRunner, all loaded earlier) -->
<script src="engine/drills/hu-suffix.js?v=2026-08-27c"></script>
<script src="engine/drills/hu-prefix.js?v=2026-08-27b"></script>
<script src="engine/drills/hu-morphology.js?v=2026-08-27b"></script>
<script src="engine/drills/hu-verb.js?v=2026-08-27b"></script>

<script src="engine/lessons.js?v=2026-08-27b"></script>

</html>
