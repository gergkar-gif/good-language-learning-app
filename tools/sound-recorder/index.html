<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sound Recorder</title>
<style>
  :root { --bg:#f6f3ec; --ink:#1d1b18; --muted:#6f6a61; --line:#d9d3c7; --accent:#b8412c; --ok:#3d7a4a; --card:#fffdf8; }
  @media (prefers-color-scheme: dark) { :root { --bg:#191816; --ink:#eee9df; --muted:#9a948a; --line:#34312c; --accent:#e0664f; --ok:#6fb07e; --card:#22201d; } }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.45 system-ui, sans-serif; display:grid; grid-template-columns:260px 1fr; min-height:100vh; }
  aside { border-right:1px solid var(--line); overflow-y:auto; max-height:100vh; padding:12px 0; }
  aside h3 { font-size:12px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); margin:14px 16px 4px; }
  aside button { display:flex; justify-content:space-between; width:100%; border:0; background:none; color:inherit; font:inherit; padding:4px 16px; cursor:pointer; text-align:left; }
  aside button.current { background:var(--card); font-weight:600; }
  aside .tick { color:var(--ok); }
  main { display:flex; flex-direction:column; align-items:center; justify-content:center; padding:24px 16px; gap:18px; }
  .group { color:var(--muted); font-size:14px; text-transform:uppercase; letter-spacing:.08em; }
  .say { font-size:clamp(72px, 14vw, 140px); font-weight:600; line-height:1; }
  .hint { color:var(--muted); max-width:34em; text-align:center; min-height:3em; }
  .controls { display:flex; gap:10px; flex-wrap:wrap; justify-content:center; }
  .controls button { font:inherit; padding:10px 18px; border-radius:8px; border:1px solid var(--line); background:var(--card); color:var(--ink); cursor:pointer; }
  #rec.on { background:var(--accent); color:#fff; border-color:var(--accent); }
  .status { font-size:14px; color:var(--muted); min-height:1.4em; }
  .meter { width:280px; height:8px; border-radius:4px; background:var(--line); overflow:hidden; }
  .meter i { display:block; height:100%; width:0; background:var(--accent); }
  .keys { font-size:13px; color:var(--muted); }
  @media (max-width:640px) { body { grid-template-columns:1fr; } aside { max-height:30vh; border-right:0; border-bottom:1px solid var(--line); } }
</style>
</head>
<body>
<aside id="list"></aside>
<main>
  <div class="group" id="group"></div>
  <div class="say" id="say"></div>
  <div class="hint" id="hint"></div>
  <div class="meter"><i id="level"></i></div>
  <div class="controls">
    <button id="prev">← Back</button>
    <button id="rec">● Record</button>
    <button id="play">▶ Play</button>
    <button id="next">Next →</button>
  </div>
  <div class="status" id="status"></div>
  <div class="keys">Space: record / stop · P: play · ← →: move</div>
</main>
<script>
// The recording list for lesson.a1.01's sound tables. `id` becomes the file
// name (tools/sound-recorder/recordings/<id>.wav).
const VOWEL_HINT = 'Just the sound, not a word — about half a second.';
const LONG_HINT = 'Just the sound, held clearly longer than the short one.';
const GROUPS = [
  ['Vowels on their own', [
    ['vowel-a', 'a', VOWEL_HINT], ['vowel-a-long', 'á', LONG_HINT],
    ['vowel-e', 'e', VOWEL_HINT], ['vowel-e-long', 'é', LONG_HINT],
    ['vowel-i', 'i', VOWEL_HINT], ['vowel-i-long', 'í', LONG_HINT],
    ['vowel-o', 'o', VOWEL_HINT], ['vowel-o-long', 'ó', LONG_HINT],
    ['vowel-oe', 'ö', VOWEL_HINT], ['vowel-oe-long', 'ő', LONG_HINT],
    ['vowel-u', 'u', VOWEL_HINT], ['vowel-u-long', 'ú', LONG_HINT],
    ['vowel-ue', 'ü', VOWEL_HINT], ['vowel-ue-long', 'ű', LONG_HINT],
  ]],
  ['Words', [
    ['word-hat', 'hat'], ['word-hat-long', 'hát'], ['word-lat', 'lát'],
    ['word-szel', 'szel'], ['word-szel-long', 'szél'], ['word-resz', 'rész'],
    ['word-irt', 'irt'], ['word-irt-long', 'írt'], ['word-viz', 'víz'],
    ['word-kor', 'kor'], ['word-kor-long', 'kór'], ['word-to', 'tó'],
    ['word-tor', 'tör'], ['word-tor-long', 'tőr'], ['word-bor-long', 'bőr'],
    ['word-hurok', 'hurok'], ['word-hurok-long', 'húrok'], ['word-kut', 'kút'],
    ['word-ut', 'üt'], ['word-ur-long', 'űr'], ['word-tuz', 'tűz'],
  ].map(([id, say]) => [id, say, 'Normal pace, one clear take.'])],
  ['Consonants you can hold', [
    ['held-sz', 'sz', 'Hold it about a second: “ssss” — no vowel before or after.'],
    ['held-s', 's', 'Hold it about a second: “shhh” — no vowel before or after.'],
    ['held-zs', 'zs', 'Hold it about a second: the s in “measure” — no vowel.'],
  ]],
  ['Consonant words', [
    ['word-szia', 'szia'], ['word-so', 'só'], ['word-zseb', 'zseb'], ['word-csak', 'csak'],
    ['word-cel', 'cél'], ['word-gyar', 'gyár'], ['word-nyar', 'nyár'], ['word-tyuk', 'tyúk'],
    ['word-kiraly', 'király'], ['word-jo', 'jó'],
  ].map(([id, say]) => [id, say, 'Normal pace, one clear take.'])],
];
const ITEMS = GROUPS.flatMap(([group, items]) => items.map(([id, say, hint]) => ({ id, say, hint, group })));

const $ = id => document.getElementById(id);
const recorded = new Set();
let index = 0, stream = null, recorder = null, chunks = [], analyser = null, audioCtx = null;

function renderList() {
  $('list').innerHTML = GROUPS.map(([group]) => `<h3>${group}</h3>` +
    ITEMS.map((item, i) => item.group !== group ? '' :
      `<button data-i="${i}" class="${i === index ? 'current' : ''}"><span>${item.say}</span><span class="tick">${recorded.has(item.id) ? '✓' : ''}</span></button>`
    ).join('')).join('');
  $('list').querySelector('.current')?.scrollIntoView({ block: 'nearest' });
}

function show() {
  const item = ITEMS[index];
  $('group').textContent = `${item.group} · ${index + 1} / ${ITEMS.length}`;
  $('say').textContent = item.say;
  $('hint').textContent = item.hint;
  $('status').textContent = recorded.has(item.id) ? 'Recorded — Play to check, Record to redo.' : '';
  renderList();
}

function go(i) { if (recorder?.state === 'recording') return; index = Math.max(0, Math.min(ITEMS.length - 1, i)); show(); }

async function ensureMic() {
  if (stream) return;
  // Voice processing off: noise suppression in particular eats sz/s/zs,
  // which are exactly the sounds being recorded.
  stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false, channelCount: 1 } });
  audioCtx = new AudioContext();
  analyser = audioCtx.createAnalyser();
  analyser.fftSize = 1024;
  audioCtx.createMediaStreamSource(stream).connect(analyser);
  const data = new Float32Array(analyser.fftSize);
  (function tick() {
    analyser.getFloatTimeDomainData(data);
    let peak = 0; for (const v of data) peak = Math.max(peak, Math.abs(v));
    $('level').style.width = Math.min(100, peak * 140) + '%';
    requestAnimationFrame(tick);
  })();
}

async function toggleRecord() {
  if (recorder?.state === 'recording') { recorder.stop(); return; }
  try { await ensureMic(); } catch (e) { $('status').textContent = 'No microphone access: ' + e.message; return; }
  const item = ITEMS[index];
  chunks = [];
  recorder = new MediaRecorder(stream);
  recorder.ondataavailable = e => chunks.push(e.data);
  recorder.onstop = () => save(item, new Blob(chunks, { type: recorder.mimeType }));
  recorder.start();
  $('rec').classList.add('on'); $('rec').textContent = '■ Stop';
  $('status').textContent = 'Recording…';
}

async function save(item, blob) {
  $('rec').classList.remove('on'); $('rec').textContent = '● Record';
  const decoded = await audioCtx.decodeAudioData(await blob.arrayBuffer());
  const res = await fetch('/save/' + item.id, { method: 'POST', body: toWav(decoded) });
  if (!res.ok) { $('status').textContent = 'Save failed (' + res.status + ')'; return; }
  recorded.add(item.id);
  show();
  $('status').textContent = `Saved ${item.id}.wav (${decoded.duration.toFixed(1)}s) — playing back…`;
  play();
}

function toWav(buffer) {
  const samples = buffer.getChannelData(0), rate = buffer.sampleRate;
  const out = new DataView(new ArrayBuffer(44 + samples.length * 2));
  const str = (o, s) => [...s].forEach((c, i) => out.setUint8(o + i, c.charCodeAt(0)));
  str(0, 'RIFF'); out.setUint32(4, 36 + samples.length * 2, true); str(8, 'WAVE');
  str(12, 'fmt '); out.setUint32(16, 16, true); out.setUint16(20, 1, true); out.setUint16(22, 1, true);
  out.setUint32(24, rate, true); out.setUint32(28, rate * 2, true); out.setUint16(32, 2, true); out.setUint16(34, 16, true);
  str(36, 'data'); out.setUint32(40, samples.length * 2, true);
  samples.forEach((v, i) => out.setInt16(44 + i * 2, Math.max(-1, Math.min(1, v)) * 0x7fff, true));
  return new Blob([out], { type: 'audio/wav' });
}

function play() {
  const item = ITEMS[index];
  if (!recorded.has(item.id)) return;
  new Audio(`recordings/${item.id}.wav?t=${Date.now()}`).play();
}

$('rec').onclick = toggleRecord;
$('play').onclick = play;
$('prev').onclick = () => go(index - 1);
$('next').onclick = () => go(index + 1);
$('list').onclick = e => { const b = e.target.closest('[data-i]'); if (b) go(+b.dataset.i); };
document.addEventListener('keydown', e => {
  if (e.code === 'Space') { e.preventDefault(); document.activeElement?.blur(); toggleRecord(); }
  else if (e.key === 'ArrowRight') go(index + 1);
  else if (e.key === 'ArrowLeft') go(index - 1);
  else if (e.key.toLowerCase() === 'p') play();
});

fetch('/status').then(r => r.json()).then(({ recorded: names }) => {
  names.forEach(n => recorded.add(n));
  const first = ITEMS.findIndex(item => !recorded.has(item.id));
  index = first === -1 ? 0 : first;
  show();
});
</script>
</body>
</html>
