<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sound Review</title>
<style>
  :root { --bg:#f6f3ec; --ink:#1d1b18; --muted:#6f6a61; --line:#d9d3c7; --accent:#b8412c; --keep:#3d7a4a; --card:#fffdf8; --wave:#8d867a; }
  @media (prefers-color-scheme: dark) { :root { --bg:#191816; --ink:#eee9df; --muted:#9a948a; --line:#34312c; --accent:#e0664f; --keep:#6fb07e; --card:#22201d; --wave:#77716a; } }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.45 system-ui, sans-serif; padding:24px 16px 60px; }
  .wrap { max-width:980px; margin:0 auto; }
  h1 { font-size:22px; margin:0 0 4px; }
  .lede { color:var(--muted); margin:0 0 20px; }
  h2 { font-size:13px; text-transform:uppercase; letter-spacing:.07em; color:var(--muted); margin:28px 0 8px; }
  .row { display:grid; grid-template-columns:90px 1fr auto; gap:12px; align-items:center; padding:8px 10px; border-bottom:1px solid var(--line); }
  .row.flagged { background:color-mix(in srgb, var(--accent) 12%, transparent); }
  .say { font-size:22px; font-weight:600; }
  .say small { display:block; font-size:11px; font-weight:400; color:var(--muted); }
  canvas { width:100%; height:44px; display:block; }
  .btns { display:flex; gap:6px; }
  button { font:inherit; font-size:13px; padding:6px 10px; border-radius:6px; border:1px solid var(--line); background:var(--card); color:var(--ink); cursor:pointer; }
  button.flag.on { background:var(--accent); border-color:var(--accent); color:#fff; }
  .pair { display:flex; gap:10px; align-items:center; padding:8px 10px; border-bottom:1px solid var(--line); }
  .pair .say { min-width:170px; }
  .legend { font-size:13px; color:var(--muted); }
  .legend i { display:inline-block; width:10px; height:10px; border-radius:2px; vertical-align:middle; margin:0 4px 0 10px; }
  @media (max-width:600px) { .row { grid-template-columns:70px 1fr; } .btns { grid-column:1 / -1; } }
</style>
</head>
<body>
<div class="wrap">
  <h1>Sound review</h1>
  <p class="lede"><b>Studio</b> is what goes in the lesson (light EQ + compression); <b>Plain</b> is the same cut without it, for comparison. Play each clip. Flag anything with a smack left in, a sound cut off, or that just sounds wrong — flags save automatically.
    <span class="legend"><i style="background:var(--keep)"></i>kept <i style="background:var(--wave)"></i>cut</span></p>
  <div id="pairs"></div>
  <div id="items"></div>
</div>
<script src="items.js"></script>
<script>
const PAIRS = [
  ['vowel-a', 'vowel-a-long'], ['vowel-e', 'vowel-e-long'], ['vowel-i', 'vowel-i-long'], ['vowel-o', 'vowel-o-long'],
  ['vowel-oe', 'vowel-oe-long'], ['vowel-u', 'vowel-u-long'], ['vowel-ue', 'vowel-ue-long'],
  ['word-hat', 'word-hat-long'], ['word-szel', 'word-szel-long'], ['word-irt', 'word-irt-long'], ['word-kor', 'word-kor-long'],
  ['word-tor', 'word-tor-long'], ['word-hurok', 'word-hurok-long'], ['word-ut', 'word-ur-long'],
];
const byId = Object.fromEntries(ITEMS.map(item => [item.id, item]));
const bust = Date.now();
let flags = {};

const SOURCES = { studio: id => `sounds/${id}.mp3`, plain: id => `plain/${id}.mp3`, raw: id => `recordings/${id}.wav` };

function play(id, source = 'studio') {
  return new Promise(resolve => {
    const audio = new Audio(`${SOURCES[source](id)}?t=${bust}`);
    audio.onended = audio.onerror = resolve;
    audio.play();
  });
}

async function playPair(a, b) {
  await play(a);
  await new Promise(r => setTimeout(r, 350));
  await play(b);
}

function draw(canvas, info) {
  const css = getComputedStyle(document.documentElement);
  const w = canvas.width = canvas.clientWidth * devicePixelRatio;
  const h = canvas.height = canvas.clientHeight * devicePixelRatio;
  const ctx = canvas.getContext('2d');
  const env = info.envelope, step = w / env.length;
  const [cutA, cutB] = info.cut.map(ms => ms / info.rawMs * w);
  env.forEach((v, i) => {
    const x = i * step, bar = Math.max(1, v * h);
    ctx.fillStyle = (x >= cutA && x <= cutB) ? css.getPropertyValue('--keep') : css.getPropertyValue('--wave');
    ctx.fillRect(x, (h - bar) / 2, Math.max(1, step), bar);
  });
}

function saveFlags() {
  fetch('/flags', { method: 'POST', body: JSON.stringify(flags, null, 2) });
}

Promise.all([fetch('review.json').then(r => r.json()), fetch('/flags').then(r => r.json())]).then(([report, saved]) => {
  flags = saved;
  const info = Object.fromEntries(report.map(r => [r.id, r]));

  document.getElementById('pairs').innerHTML = '<h2>Pairs — short then long</h2>' + PAIRS.map(([a, b]) =>
    `<div class="pair"><span class="say">${byId[a].say} · ${byId[b].say}</span><button data-pair="${a},${b}">▶ Play pair</button></div>`).join('');

  document.getElementById('items').innerHTML = GROUPS.map(([group, items]) => `<h2>${group}</h2>` + items.map(([id, say]) => `
    <div class="row ${flags[id] ? 'flagged' : ''}" data-id="${id}">
      <div class="say">${say}<small>${id}${info[id]?.manual ? ' · manual cut' : ''}</small></div>
      <canvas></canvas>
      <div class="btns">
        <button data-play="${id}">▶ Studio</button>
        <button data-plain="${id}">Plain</button>
        <button data-raw="${id}">Raw take</button>
        <button class="flag ${flags[id] ? 'on' : ''}" data-flag="${id}">⚑ Flag</button>
      </div>
    </div>`).join('')).join('');

  const drawAll = () => document.querySelectorAll('.row').forEach(row => { if (info[row.dataset.id]) draw(row.querySelector('canvas'), info[row.dataset.id]); });
  drawAll();
  addEventListener('resize', drawAll);

  document.body.addEventListener('click', e => {
    const b = e.target.closest('button');
    if (!b) return;
    if (b.dataset.play) play(b.dataset.play);
    if (b.dataset.plain) play(b.dataset.plain, 'plain');
    if (b.dataset.raw) play(b.dataset.raw, 'raw');
    if (b.dataset.pair) playPair(...b.dataset.pair.split(','));
    if (b.dataset.flag) {
      const id = b.dataset.flag;
      if (flags[id]) delete flags[id]; else flags[id] = true;
      b.classList.toggle('on', !!flags[id]);
      b.closest('.row').classList.toggle('flagged', !!flags[id]);
      saveFlags();
    }
  });
});
</script>
</body>
</html>
