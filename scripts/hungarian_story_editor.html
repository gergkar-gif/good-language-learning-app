ay Meg says good night)."}]}}}}, "a1-unit-16": {"id": "story.a1.unit16", "title": "Time & Dates", "lesson": 80, "level": "A1", "script": "[Meg and Károly need to choose a day and time for a meeting.]\n\nKároly: Mikor van a találkozó?\nMeg: Pénteken reggel. Hány óra?\nKároly: Fél tíz. Még van néhány perc.\nMeg: Hétfőn, kedden, szerdán vagy csütörtökön? Szerda is jó.\nKároly: Nem. Péntek jó. Szombat vagy vasárnap is jó.\nMeg: Január, február, március vagy április?\nKároly: Április. Délben dolgozom, délután szabad vagyok, este otthon vagyok.\nMeg: Hány perc?\nKároly: Negyed óra. Találkozunk pénteken.\nMeg: Délután jó, este is jó. Hány óra? Negyed óra?\n\n=== QUESTIONS ===\n\n1. Miről egyeztet Meg és Károly a történetben?\n  [ ] Egy könyv áráról a boltban\n  [ ] Egy új lakás szobáiról\n  [x] Egy találkozó napjáról és időpontjáról\n  [ ] A dél-afrikai időjárásról\n  > Meg és Károly időpontot és napot próbálnak kiválasztani a találkozóhoz (Meg and Károly coordinate the day and time for a meeting).\n\n2. Melyik napot és hónapot választják ki a találkozóra?\n  [ ] Hétfőt januárban\n  [ ] Szerdát márciusban\n  [ ] Keddet februárban\n  [x] Pénteket áprilisban\n  > Károly megerősíti: „Április” és „Találkozunk pénteken” (April, and we meet on Friday).\n\n3. Mikor ér rá Károly a kiválasztott napon?\n  [x] Délután szabad, este pedig otthon van\n  [ ] Csak kora reggel ér rá\n  [ ] Egész nap dolgozik késő éjszakáig\n  [ ] Csak délben van fél órája\n  > Károly mondja: „Délben dolgozom, délután szabad vagyok, este otthon vagyok” (At noon I work, in the afternoon I am free, in the evening I am home).\n", "raw": {"id": "story.a1.unit16", "title": "Time & Dates", "level": "A1", "lesson": 80, "type": "original", "estimatedMinutes": 4, "characters": ["Károly", "Meg", "András", "Anna", "Mariann"], "paragraphs": [{"type": "narration", "lang": "en", "text": "Meg and Károly need to choose a day and time for a meeting."}, {"type": "dialogue", "speaker": "Károly", "text": "Mikor van a találkozó?"}, {"type": "dialogue", "speaker": "Meg", "text": "Pénteken reggel. Hány óra?"}, {"type": "dialogue", "speaker": "Károly", "text": "Fél tíz. Még van néhány perc."}, {"type": "dialogue", "speaker": "Meg", "text": "Hétfőn, kedden, szerdán vagy csütörtökön? Szerda is jó."}, {"type": "dialogue", "speaker": "Károly", "text": "Nem. Péntek jó. Szombat vagy vasárnap is jó."}, {"type": "dialogue", "speaker": "Meg", "text": "Január, február, március vagy április?"}, {"type": "dialogue", "speaker": "Károly", "text": "Április. Délben dolgozom, délután szabad vagyok, este otthon vagyok."}, {"type": "dialogue", "speaker": "Meg", "text": "Hány perc?"}, {"type": "dialogue", "speaker": "Károly", "text": "Negyed óra. Találkozunk pénteken."}, {"type": "dialogue", "speaker": "Meg", "text": "Délután jó, este is jó. Hány óra? Negyed óra?"}], "narration": {"pedagogical": {"comprehensionQuestions": [{"question": "Miről egyeztet Meg és Károly a történetben?", "options": ["Egy könyv áráról a boltban", "Egy új lakás szobáiról", "Egy találkozó napjáról és időpontjáról", "A dél-afrikai időjárásról"], "correctIndex": 2, "explanation": "Meg és Károly időpontot és napot próbálnak kiválasztani a találkozóhoz (Meg and Károly coordinate the day and time for a meeting)."}, {"question": "Melyik napot és hónapot választják ki a találkozóra?", "options": ["Hétfőt januárban", "Szerdát márciusban", "Keddet februárban", "Pénteket áprilisban"], "correctIndex": 3, "explanation": "Károly megerősíti: „Április” és „Találkozunk pénteken” (April, and we meet on Friday)."}, {"question": "Mikor ér rá Károly a kiválasztott napon?", "options": ["Délután szabad, este pedig otthon van", "Csak kora reggel ér rá", "Egész nap dolgozik késő éjszakáig", "Csak délben van fél órája"], "correctIndex": 0, "explanation": "Károly mondja: „Délben dolgozom, délután szabad vagyok, este otthon vagyok” (At noon I work, in the afternoon I am free, in the evening I am home)."}]}}}}, "a1-unit-17": {"id": "story.a1.unit17", "title": "Frequency & Word Order", "lesson": 85, "level": "A1", "script": "[Meg and Károly compare their habits.]\n\nMeg: Én mindig reggel tanulok. Te gyakran sportolsz? Általában igen.\nKároly: Igen. Általában sportolok, de néha pihenek.\nMeg: Én ritkán dolgozom hétvégén. Soha nem dolgozom vasárnap.\nKároly: Minden nap együtt vagyunk?\nMeg: Nem. Ma otthon vagyok, most pedig tanulok.\nKároly: Hétvégén gyakran van munka.\nMeg: A tanulás is fontos. A pihenés is fontos.\nKároly: A sport jó. A munka után pihenés kell. Iskolában is szokott tanulni.\nMeg: Minden nap tanulok, de hétvégén ritkán van tanulás. Általában otthon tanulok.\n\n=== QUESTIONS ===\n\n1. Milyen témát vitat meg Meg és Károly ebben a leckében?\n  [ ] A legújabb budapesti mozifilmeket\n  [x] A szokásaikat, és hogy mit milyen gyakran csinálnak\n  [ ] Egy finom vacsora receptjét\n  [ ] A tömegközlekedési jegyek árait\n  > Meg és Károly összehasonlítják a szokásaikat és a tevékenységek gyakoriságát (They compare habits and frequency of activities: always, often, sometimes, rarely, never).\n\n2. Mikor dolgozik Meg vasárnap?\n  [x] Soha nem dolgozik vasárnap\n  [ ] Mindig reggel dolgozik vasárnap\n  [ ] Délutánonként dolgozik\n  [ ] Egész nap dolgozik\n  > Meg kijelenti: „Soha nem dolgozom vasárnap” (I never work on Sunday).\n\n3. Mikor és hol szokott általában tanulni Meg?\n  [ ] Este az egyetemi könyvtárban\n  [ ] Délután a parkban a barátaival\n  [x] Mindig reggel és általában otthon\n  [ ] Csak a hétvégi napokon a munkahelyén\n  > Meg elmondja: „Én mindig reggel tanulok” és „Általában otthon tanulok” (I always study in the morning and usually study at home).\n", "raw": {"id": "story.a1.unit17", "title": "Frequency & Word Order", "level": "A1", "lesson": 85, "type": "original", "estimatedMinutes": 4, "characters": ["Károly", "Meg", "András", "Anna", "Mariann"], "paragraphs": [{"type": "narration", "lang": "en", "text": "Meg and Károly compare their habits."}, {"type": "dialogue", "speaker": "Meg", "text": "Én mindig reggel tanulok. Te gyakran sportolsz? Általában igen."}, {"type": "dialogue", "speaker": "Károly", "text": "Igen. Általában sportolok, de néha pihenek."}, {"type": "dialogue", "speaker": "Meg", "text": "Én ritkán dolgozom hétvégén. Soha nem dolgozom vasárnap."}, {"type": "dialogue", "speaker": "Károly", "text": "Minden nap együtt vagyunk?"}, {"type": "dialogue", "speaker": "Meg", "text": "Nem. Ma otthon vagyok, most pedig tanulok."}, {"type": "dialogue", "speaker": "Károly", "text": "Hétvégén gyakran van munka."}, {"type": "dialogue", "speaker": "Meg", "text": "A tanulás is fontos. A pihenés is fontos."}, {"type": "dialogue", "speaker": "Károly", "text": "A sport jó. A munka után pihenés kell. Iskolában is szokott tanulni."}, {"type": "dialogue", "speaker": "Meg", "text": "Minden nap tanulok, de hétvégén ritkán van tanulás. Általában otthon tanulok."}], "narration": {"pedagogical": {"comprehensionQuestions": [{"question": "Milyen témát vitat meg Meg és Károly ebben a leckében?", "options": ["A legújabb budapesti mozifilmeket", "A szokásaikat, és hogy mit milyen gyakran csinálnak", "Egy finom vacsora receptjét", "A tömegközlekedési jegyek árait"], "correctIndex": 1, "explanation": "Meg és Károly összehasonlítják a szokásaikat és a tevékenységek gyakoriságát (They compare habits and frequency of activities: always, often, sometimes, rarely, never)."}, {"question": "Mikor dolgozik Meg vasárnap?", "options": ["Soha nem dolgozik vasárnap", "Mindig reggel dolgozik vasárnap", "Délutánonként dolgozik", "Egész nap dolgozik"], "correctIndex": 0, "explanation": "Meg kijelenti: „Soha nem dolgozom vasárnap” (I never work on Sunday)."}, {"question": "Mikor és hol szokott általában tanulni Meg?", "options": ["Este az egyetemi könyvtárban", "Délután a parkban a barátaival", "Mindig reggel és általában otthon", "Csak a hétvégi napokon a munkahelyén"], "correctIndex": 2, "explanation": "Meg elmondja: „Én mindig reggel tanulok” és „Általában otthon tanulok” (I always study in the morning and usually study at home)."}]}}}}, "a1-unit-18": {"id": "story.a1.unit18", "title": "The Home", "lesson": 90, "level": "A1", "script": "[Meg spends an afternoon at Károly’s home.]\n\nKároly: A nappali világos és otthonos.\nMeg: A hálószoba is világos. A konyha a nappali mellett van.\nKároly: A fürdőszoba a hálószoba mellett van.\nMeg: Az asztal a kanapé előtt van. A szék az asztal mellett van.\nKároly: Az ágy az ablak mögött van.\nMeg: A lámpa a tükör előtt van.\nKároly: Az ajtó az ablak mellett van.\nMeg: A szék a kanapé és az asztal között van. A lakás kényelmes.\nMeg: A lakás tiszta, kényelmes és világos.\nKároly: A lámpa a tükör előtt, az ajtó az ablak mellett van.\n\n=== QUESTIONS ===\n\n1. Hol van Meg, és miről beszélget Károllyal?\n  [ ] Egy kávézóban beszélgetnek az iskoláról.\n  [x] Károly lakásában nézik meg a szobákat és a bútorokat.\n  [ ] A piacon vásárolnak zöldségeket és gyümölcsöket.\n  [ ] Egy étteremben rendelnek ebédet.\n  > Meg Károly otthonában van, ahol a lakás szobáiról és a bútorok helyéről beszélgetnek (Meg spends an afternoon at Károly’s home).\n\n2. Mi van a konyha mellett a lakásban?\n  [ ] A fürdőszoba\n  [ ] Az erkély\n  [x] A nappali\n  [ ] A kert\n  > Meg mondja: „A konyha a nappali mellett van.” (The kitchen is next to the living room.)\n\n3. Milyen Károly lakása Meg szerint?\n  [x] Tiszta, kényelmes és világos.\n  [ ] Sötét, kicsi és hideg.\n  [ ] Nagyon zajos és zsúfolt.\n  [ ] Régi és kényelmetlen.\n  > Meg így foglalja össze: „A lakás tiszta, kényelmes és világos.” (The apartment is clean, comfortable and bright.)\n", "raw": {"id": "story.a1.unit18", "title": "The Home", "level": "A1", "lesson": 90, "type": "original", "estimatedMinutes": 4, "characters": ["Károly", "Meg", "András", "Anna", "Mariann"], "paragraphs": [{"type": "narration", "lang": "en", "text": "Meg spends an afternoon at Károly’s home."}, {"type": "dialogue", "speaker": "Károly", "text": "A nappali világos és otthonos."}, {"type": "dialogue", "speaker": "Meg", "text": "A hálószoba is világos. A konyha a nappali mellett van."}, {"type": "dialogue", "speaker": "Károly", "text": "A fürdőszoba a hálószoba mellett van."}, {"type": "dialogue", "speaker": "Meg", "text": "Az asztal a kanapé előtt van. A szék az asztal mellett van."}, {"type": "dialogue", "speaker": "Károly", "text": "Az ágy az ablak mögött van."}, {"type": "dialogue", "speaker": "Meg", "text": "A lámpa a tükör előtt van."}, {"type": "dialogue", "speaker": "Károly", "text": "Az ajtó az ablak mellett van."}, {"type": "dialogue", "speaker": "Meg", "text": "A szék a kanapé és az asztal között van. A lakás kényelmes."}, {"type": "dialogue", "speaker": "Meg", "text": "A lakás tiszta, kényelmes és világos."}, {"type": "dialogue", "speaker": "Károly", "text": "A lámpa a tükör előtt, az ajtó az ablak mellett van."}], "narration": {"pedagogical": {"comprehensionQuestions": [{"question": "Hol van Meg, és miről beszélget Károllyal?", "options": ["Egy kávézóban beszélgetnek az iskoláról.", "Károly lakásában nézik meg a szobákat és a bútorokat.", "A piacon vásárolnak zöldségeket és gyümölcsöket.", "Egy étteremben rendelnek ebédet."], "correctIndex": 1, "explanation": "Meg Károly otthonában van, ahol a lakás szobáiról és a bútorok helyéről beszélgetnek (Meg spends an afternoon at Károly’s home)."}, {"question": "Mi van a konyha mellett a lakásban?", "options": ["A fürdőszoba", "Az erkély", "A nappali", "A kert"], "correctIndex": 2, "explanation": "Meg mondja: „A konyha a nappali mellett van.” (The kitchen is next to the living room.)"}, {"question": "Milyen Károly lakása Meg szerint?", "options": ["Tiszta, kényelmes és világos.", "Sötét, kicsi és hideg.", "Nagyon zajos és zsúfolt.", "Régi és kényelmetlen."], "correctIndex": 0, "explanation": "Meg így foglalja össze: „A lakás tiszta, kényelmes és világos.” (The apartment is clean, comfortable and bright.)"}]}}}}, "a1-unit-19": {"id": "story.a1.unit19", "title": "Food & Drink", "lesson": 95, "level": "A1", "script": "[Meg and Károly prepare a simple meal.]\n\nKároly: Van kenyér, vaj, sajt, tej és víz.\nMeg: Kérek vizet, kávét és teát.\nKároly: A reggeli egyszerű. Ebédre lesz leves és alma.\nMeg: Kérek egy üveg vizet és egy pohár teát.\nKároly: Van két darab alma, de kevés a sajt.\nMeg: Nem vagyok szomjas, de éhes vagyok.\nKároly: A vacsora finom lesz.\nMeg: Kérek levest. A leves nagyon finom.\nMeg: Egy darab alma és egy pohár tea kérek.\n\n=== QUESTIONS ===\n\n1. Mit csinál Meg és Károly a történetben?\n  [ ] Egy étteremben vacsoráznak a barátaikkal.\n  [ ] A piacon zöldségeket és gyümölcsöket vásárolnak.\n  [x] Egyszerű ételeket és italokat készítenek otthon.\n  [ ] Vonattal utaznak a vasútállomásra.\n  > Meg és Károly egyszerű ételt készítenek, és megbeszélik az otthoni ételeket (Meg and Károly prepare a simple meal).\n\n2. Mi lesz az ebéd Károly szerint?\n  [ ] Csirke és rizs\n  [x] Leves és alma\n  [ ] Szendvics és narancslé\n  [ ] Hal és saláta\n  > Károly ezt mondja: „Ebédre lesz leves és alma.” (For lunch there will be soup and apple.)\n\n3. Hogy érzi magát Meg az ételek megbeszélésekor?\n  [ ] Nagyon szomjas, de nem éhes.\n  [ ] Nagyon fáradt és álmos.\n  [ ] Nem éhes és nem szomjas.\n  [x] Éhes, de nem szomjas.\n  > Meg kifejezetten mondja: „Nem vagyok szomjas, de éhes vagyok.” (I am not thirsty, but I am hungry.)\n", "raw": {"id": "story.a1.unit19", "title": "Food & Drink", "level": "A1", "lesson": 95, "type": "original", "estimatedMinutes": 4, "characters": ["Károly", "Meg", "András", "Anna", "Mariann"], "paragraphs": [{"type": "narration", "lang": "en", "text": "Meg and Károly prepare a simple meal."}, {"type": "dialogue", "speaker": "Károly", "text": "Van kenyér, vaj, sajt, tej és víz."}, {"type": "dialogue", "speaker": "Meg", "text": "Kérek vizet, kávét és teát."}, {"type": "dialogue", "speaker": "Károly", "text": "A reggeli egyszerű. Ebédre lesz leves és alma."}, {"type": "dialogue", "speaker": "Meg", "text": "Kérek egy üveg vizet és egy pohár teát."}, {"type": "dialogue", "speaker": "Károly", "text": "Van két darab alma, de kevés a sajt."}, {"type": "dialogue", "speaker": "Meg", "text": "Nem vagyok szomjas, de éhes vagyok."}, {"type": "dialogue", "speaker": "Károly", "text": "A vacsora finom lesz."}, {"type": "dialogue", "speaker": "Meg", "text": "Kérek levest. A leves nagyon finom."}, {"type": "dialogue", "speaker": "Meg", "text": "Egy darab alma és egy pohár tea kérek."}], "narration": {"pedagogical": {"comprehensionQuestions": [{"question": "Mit csinál Meg és Károly a történetben?", "options": ["Egy étteremben vacsoráznak a barátaikkal.", "A piacon zöldségeket és gyümölcsöket vásárolnak.", "Egyszerű ételeket és italokat készítenek otthon.", "Vonattal utaznak a vasútállomásra."], "correctIndex": 2, "explanation": "Meg és Károly egyszerű ételt készítenek, és megbeszélik az otthoni ételeket (Meg and Károly prepare a simple meal)."}, {"question": "Mi lesz az ebéd Károly szerint?", "options": ["Csirke és rizs", "Leves és alma", "Szendvics és narancslé", "Hal és saláta"], "correctIndex": 1, "explanation": "Károly ezt mondja: „Ebédre lesz leves és alma.” (For lunch there will be soup and apple.)"}, {"question": "Hogy érzi magát Meg az ételek megbeszélésekor?", "options": ["Nagyon szomjas, de nem éhes.", "Nagyon fáradt és álmos.", "Nem éhes és nem szomjas.", "Éhes, de nem szomjas."], "correctIndex": 3, "explanation": "Meg kifejezetten mondja: „Nem vagyok szomjas, de éhes vagyok.” (I am not thirsty, but I am hungry.)"}]}}}}, "a1-unit-20": {"id": "story.a1.unit20", "title": "Review 2: Everyday Hungarian", "lesson": 100, "level": "A1", "script": "[On Monday, the group spends a day together and reviews familiar Hungarian.]\n\nKároly: Hétfőn reggel otthon vagyunk.\nMeg: A szoba és a konyha rendben van.\nKároly: Utána megyünk az iskolába. András jön velünk.\nMeg: András dolgozik, Anna tanul.\nKároly: Én mindig reggel dolgozom, de néha otthon tanulok.\nMeg: A bolt az iskola mellett van.\nKároly: Délben ebédelünk. Kérek kenyeret és kávét.\nMeg: A találkozó után együtt megyünk haza.\nKároly: Jó nap volt. Holnap is találkozunk.\nMeg: A konyhában van a kenyér, az asztalon a kávé. Az ágy a szobában van.\n\n=== QUESTIONS ===\n\n1. Melyik napról és milyen tevékenységekről szól a szöveg?\n  [x] Hétfői napi rutinról és a barátok közös programjáról.\n  [ ] Egy hétvégi kirándulásról a hegyekben.\n  [ ] Egy vasárnapi bevásárlásról a piacon.\n  [ ] Egy születésnapi partiról egy étteremben.\n  > A történet hétfőn játszódik, amikor a csoport együtt tölti a napot (iskola, munka, ebéd, hazatérés).\n\n2. Mit csinál András és Anna a szöveg szerint?\n  [ ] Anna főz, András alszik.\n  [ ] Anna vásárol, András étterembe megy.\n  [x] András dolgozik, és Anna tanul.\n  [ ] Mindketten a boltban dolgoznak.\n  > Meg megjegyzi: „András dolgozik, Anna tanul.” (András works, Anna studies.)\n\n3. Mit terveznek a barátok a nap végén?\n  [ ] Este moziba mennek Andrással.\n  [x] Együtt mennek haza, és másnap is találkoznak.\n  [ ] Azonnal elutaznak egy másik városba.\n  [ ] Késő estig az iskolában tanulnak.\n  > Meg mondja: „együtt megyünk haza”, Károly pedig hozzáteszi: „Holnap is találkozunk.” (Together we go home... Tomorrow we meet again too.)\n", "raw": {"id": "story.a1.unit20", "title": "Review 2: Everyday Hungarian", "level": "A1", "lesson": 100, "type": "original", "estimatedMinutes": 4, "characters": ["Károly", "Meg", "András", "Anna", "Mariann"], "paragraphs": [{"type": "narration", "lang": "en", "text": "On Monday, the group spends a day together and reviews familiar Hungarian."}, {"type": "dialogue", "speaker": "Károly", "text": "Hétfőn reggel otthon vagyunk."}, {"type": "dialogue", "speaker": "Meg", "text": "A szoba és a konyha rendben van."}, {"type": "dialogue", "speaker": "Károly", "text": "Utána megyünk az iskolába. András jön velünk."}, {"type": "dialogue", "speaker": "Meg", "text": "András dolgozik, Anna tanul."}, {"type": "dialogue", "speaker": "Károly", "text": "Én mindig reggel dolgozom, de néha otthon tanulok."}, {"type": "dialogue", "speaker": "Meg", "text": "A bolt az iskola mellett van."}, {"type": "dialogue", "speaker": "Károly", "text": "Délben ebédelünk. Kérek kenyeret és kávét."}, {"type": "dialogue", "speaker": "Meg", "text": "A találkozó után együtt megyünk haza."}, {"type": "dialogue", "speaker": "Károly", "text": "Jó nap volt. Holnap is találkozunk."}, {"type": "dialogue", "speaker": "Meg", "text": "A konyhában van a kenyér, az asztalon a kávé. Az ágy a szobában van."}], "narration": {"pedagogical": {"comprehensionQuestions": [{"question": "Melyik napról és milyen tevékenységekről szól a szöveg?", "options": ["Hétfői napi rutinról és a barátok közös programjáról.", "Egy hétvégi kirándulásról a hegyekben.", "Egy vasárnapi bevásárlásról a piacon.", "Egy születésnapi partiról egy étteremben."], "correctIndex": 0, "explanation": "A történet hétfőn játszódik, amikor a csoport együtt tölti a napot (iskola, munka, ebéd, hazatérés)."}, {"question": "Mit csinál András és Anna a szöveg szerint?", "options": ["Anna főz, András alszik.", "Anna vásárol, András étterembe megy.", "András dolgozik, és Anna tanul.", "Mindketten a boltban dolgoznak."], "correctIndex": 2, "explanation": "Meg megjegyzi: „András dolgozik, Anna tanul.” (András works, Anna studies.)"}, {"question": "Mit terveznek a barátok a nap végén?", "options": ["Este moziba mennek Andrással.", "Együtt mennek haza, és másnap is találkoznak.", "Azonnal elutaznak egy másik városba.", "Késő estig az iskolában tanulnak."], "correctIndex": 1, "explanation": "Meg mondja: „együtt megyünk haza”, Károly pedig hozzáteszi: „Holnap is találkozunk.” (Together we go home... Tomorrow we meet again too.)"}]}}}}, "a1-unit-21": {"id": "story.a1.unit21", "title": "Buying Food", "lesson": null, "level": "A1", "script": "[Meg and Károly go to a shop because they need food.]\n\nKároly: Jó napot kívánok!\nMeg: Kérek kenyeret, tejet és sajtot.\nEladó: Almát vagy narancsot kér?\nMeg: Kérek két almát és egy narancsot.\nKároly: Mennyi a hús?\nEladó: Három forint egy kiló. Nem drága.\nMeg: Kérek egy kiló húst és egy liter vizet.\n[Meg asks about the price and then pays.]\n\nMeg: Mennyi az ár?\nEladó: Olcsó. Öt forint.\nMeg: Rendben. Fizetek.\n[Meg buys bread, apples, eggs, fish, and rice. She also asks for water and a piece of cake.]\n\n\n=== QUESTIONS ===\n\n1. Hol játszódik a beszélgetés?\n  [ ] Egy ruhaboltban\n  [ ] Egy buszmegállóban\n  [x] Egy élelmiszerboltban\n  [ ] Egy postahivatalban\n  > Meg és Károly egy boltban élelmiszereket (kenyér, tej, sajt, gyümölcs, hús) vásárolnak az eladótól.\n\n2. Mennyi gyümölcsöt kér Meg az eladótól?\n  [x] Két almát és egy narancsot\n  [ ] Három almát és két citromot\n  [ ] Csak öt narancsot\n  [ ] Egy kiló banánt\n  > Meg így válaszol az eladónak: „Kérek két almát és egy narancsot.” (I'd like two apples and an orange.)\n\n3. Mi történik a vásárlás végén, amikor Meg megtudja az árat?\n  [ ] Meg nem veszi meg a termékeket, mert túl drágák.\n  [ ] Károly kártyával fizet a pénztárnál.\n  [ ] Meg visszateszi a kenyeret a polcra.\n  [x] Meg elfogadja az árat, és fizet.\n  > Amikor az eladó mondja, hogy olcsó (öt forint), Meg így dönt: „Rendben. Fizetek.” (Alright. I'll pay.)\n", "raw": {"id": "story.a1.unit21", "title": "Buying Food", "level": "A1", "type": "original", "characters": ["Károly", "Meg", "Eladó"], "paragraphs": [{"type": "narration", "lang": "en", "text": "Meg and Károly go to a shop because they need food."}, {"type": "dialogue", "speaker": "Károly", "text": "Jó napot kívánok!"}, {"type": "dialogue", "speaker": "Meg", "text": "Kérek kenyeret, tejet és sajtot."}, {"type": "dialogue", "speaker": "Eladó", "text": "Almát vagy narancsot kér?"}, {"type": "dialogue", "speaker": "Meg", "text": "Kérek két almát és egy narancsot."}, {"type": "dialogue", "speaker": "Károly", "text": "Mennyi a hús?"}, {"type": "dialogue", "speaker": "Eladó", "text": "Három forint egy kiló. Nem drága."}, {"type": "dialogue", "speaker": "Meg", "text": "Kérek egy kiló húst és egy liter vizet."}, {"type": "narration", "lang": "en", "text": "Meg asks about the price and then pays."}, {"type": "dialogue", "speaker": "Meg", "text": "Mennyi az ár?"}, {"type": "dialogue", "speaker": "Eladó", "text": "Olcsó. Öt forint."}, {"type": "dialogue", "speaker": "Meg", "text": "Rendben. Fizetek."}, {"type": "narration", "lang": "en", "text": "Meg buys bread, apples, eggs, fish, and rice. She also asks for water and a piece of cake."}], "narration": {"pedagogical": {"comprehensionQuestions": [{"question": "Hol játszódik a beszélgetés?", "options": ["Egy ruhaboltban", "Egy buszmegállóban", "Egy élelmiszerboltban", "Egy postahivatalban"], "correctIndex": 2, "explanation": "Meg és Károly egy boltban élelmiszereket (kenyér, tej, sajt, gyümölcs, hús) vásárolnak az eladótól."}, {"question": "Mennyi gyümölcsöt kér Meg az eladótól?", "options": ["Két almát és egy narancsot", "Három almát és két citromot", "Csak öt narancsot", "Egy kiló banánt"], "correctIndex": 0, "explanation": "Meg így válaszol az eladónak: „Kérek két almát és egy narancsot.” (I'd like two apples and an orange.)"}, {"question": "Mi történik a vásárlás végén, amikor Meg megtudja az árat?", "options": ["Meg nem veszi meg a termékeket, mert túl drágák.", "Károly kártyával fizet a pénztárnál.", "Meg visszateszi a kenyeret a polcra.", "Meg elfogadja az árat, és fizet."], "correctIndex": 3, "explanation": "Amikor az eladó mondja, hogy olcsó (öt forint), Meg így dönt: „Rendben. Fizetek.” (Alright. I'll pay.)"}]}}}}, "a1-unit-22": {"id": "story.a1.unit22", "title": "At the Market", "lesson": null, "level": "A1", "script": "[Károly and Meg visit the market to choose fresh ingredients.]\n\nKároly: Itt a piac. Sok árus van.\nMeg: Mennyi a paradicsom?\nÁrus: Egy kiló három forint.\nMeg: Kérek fél kiló paradicsomot és egy kiló krumplit.\nKároly: Ez a hagyma friss?\nÁrus: Igen, friss. A répa is friss.\nMeg: Kérek egy csomag vajat és egy üveg tejfölt.\nKároly: Hány csomag kolbász kell?\nMeg: Egy csomag. És egy csirke.\nÁrus: Negyed kiló is elég?\nMeg: Igen, köszönöm.\n[Meg chooses fresh vegetables and fruit. At the market, she also looks at meat, milk, and sour cream, and asks for a packet of butter and a packet of sausage.]\n\n\n=== QUESTIONS ===\n\n1. Miért mennek a szereplők a piacra?\n  [x] Friss élelmiszereket és hozzávalókat vásárolni.\n  [ ] Új ruhát és cipőt venni.\n  [ ] Találkozni a barátaikkal egy kávézóban.\n  [ ] Vonatjegyet váltani a Keleti pályaudvaron.\n  > Károly és Meg a piacra mennek, hogy friss zöldségeket és élelmiszereket válogassanak (visit the market to choose fresh ingredients).\n\n2. Mennyi paradicsomot és krumplit kér Meg az árustól?\n  [ ] Két kiló paradicsomot és fél kiló répát\n  [x] Fél kiló paradicsomot és egy kiló krumplit\n  [ ] Egy kiló paradicsomot és két kiló hagymát\n  [ ] Három kiló krumplit paradicsom nélkül\n  > Meg pontosan ezt kéri: „Kérek fél kiló paradicsomot és egy kiló krumplit.” (I'd like half a kilo of tomatoes and one kilo of potatoes.)\n\n3. Mit mond az árus a zöldségekről?\n  [ ] A hagyma már régi, de olcsó.\n  [ ] Nincs több zöldség a standon.\n  [x] A hagyma és a répa is friss.\n  [ ] A zöldségek tegnapról maradtak meg.\n  > Károly kérdésére az árus megerősíti: „Igen, friss. A répa is friss.” (Yes, it's fresh. The carrots are fresh too.)\n", "raw": {"id": "story.a1.unit22", "title": "At the Market", "level": "A1", "type": "original", "characters": ["Károly", "Meg", "Árus"], "paragraphs": [{"type": "narration", "lang": "en", "text": "Károly and Meg visit the market to choose fresh ingredients."}, {"type": "dialogue", "speaker": "Károly", "text": "Itt a piac. Sok árus van."}, {"type": "dialogue", "speaker": "Meg", "text": "Mennyi a paradicsom?"}, {"type": "dialogue", "speaker": "Árus", "text": "Egy kiló három forint."}, {"type": "dialogue", "speaker": "Meg", "text": "Kérek fél kiló paradicsomot és egy kiló krumplit."}, {"type": "dialogue", "speaker": "Károly", "text": "Ez a hagyma friss?"}, {"type": "dialogue", "speaker": "Árus", "text": "Igen, friss. A répa is friss."}, {"type": "dialogue", "speaker": "Meg", "text": "Kérek egy csomag vajat és egy üveg tejfölt."}, {"type": "dialogue", "speaker": "Károly", "text": "Hány csomag kolbász kell?"}, {"type": "dialogue", "speaker": "Meg", "text": "Egy csomag. És egy csirke."}, {"type": "dialogue", "speaker": "Árus", "text": "Negyed kiló is elég?"}, {"type": "dialogue", "speaker": "Meg", "text": "Igen, köszönöm."}, {"type": "narration", "lang": "en", "text": "Meg chooses fresh vegetables and fruit. At the market, she also looks at meat, milk, and sour cream, and asks for a packet of butter and a packet of sausage."}], "narration": {"pedagogical": {"comprehensionQuestions": [{"question": "Miért mennek a szereplők a piacra?", "options": ["Friss élelmiszereket és hozzávalókat vásárolni.", "Új ruhát és cipőt venni.", "Találkozni a barátaikkal egy kávézóban.", "Vonatjegyet váltani a Keleti pályaudvaron."], "correctIndex": 0, "explanation": "Károly és Meg a piacra mennek, hogy friss zöldségeket és élelmiszereket válogassanak (visit the market to choose fresh ingredients)."}, {"question": "Mennyi paradicsomot és krumplit kér Meg az árustól?", "options": ["Két kiló paradicsomot és fél kiló répát", "Fél kiló paradicsomot és egy kiló krumplit", "Egy kiló paradicsomot és két kiló hagymát", "Három kiló krumplit paradicsom nélkül"], "correctIndex": 1, "explanation": "Meg pontosan ezt kéri: „Kérek fél kiló paradicsomot és egy kiló krumplit.” (I'd like half a kilo of tomatoes and one kilo of potatoes.)"}, {"question": "Mit mond az árus a zöldségekről?", "options": ["A hagyma már régi, de olcsó.", "Nincs több zöldség a standon.", "A hagyma és a répa is friss.", "A zöldségek tegnapról maradtak meg."], "correctIndex": 2, "explanation": "Károly kérdésére az árus megerősíti: „Igen, friss. A répa is friss.” (Yes, it's fresh. The carrots are fresh too.)"}]}}}}, "a1-unit-23": {"id": "story.a1.unit23", "title": "At the Café", "lesson": null, "level": "A1", "script": "[The group meets at a café. Meg orders in Hungarian.]\n\nPincér: Jó napot kívánok! Itt az étlap.\nMeg: Kérek egy kávét és egy teát.\nPincér: Szeretne limonádét vagy üdítőt?\nMeg: Szeretnék egy limonádét. És egy szendvicset kérek.\nPincér: Kér még süteményt?\nMeg: Igen, kérek egy süteményt.\nKároly: Én kérek reggelit.\nMeg: Kérek cukrot és tejet is.\nPincér: Hozom. Meleg a kávé.\nMeg: Köszönöm. Finom.\nPincér: Kérik a számlát?\nMeg: Igen, kérem.\n[The waiter brings coffee, tea, lemonade, and soda. Meg asks for a sandwich, a pastry, and a breakfast plate, along with some sugar and milk.]\n\n\n=== QUESTIONS ===\n\n1. Miről szól a beszélgetés a kávézóban?\n  [x] Meg és Károly italokat és ételt rendelnek a pincértől.\n  [ ] A pincér új munkatársat keres a kávézóba.\n  [ ] Meg panaszkodik a hideg kávé miatt.\n  [ ] Károly elmagyarázza az utat a vendégeknek.\n  > Meg és Károly a kávézóban kávét, teát, limonádét és ételeket rendelnek a pincértől magyarul.\n\n2. Mit kér Károly a pincértől?\n  [ ] Csak egy pohár hideg vizet\n  [ ] Egy nagy adag süteményt\n  [x] Reggelit kér\n  [ ] Egy fekete teát cukorral\n  > Károly ezt mondja: „Én kérek reggelit.” (I'll have breakfast.)\n\n3. Mi történik, miután megkapják a rendelést?\n  [ ] Meg visszaküldi a meleg kávét a pincérnek.\n  [x] Meg finomnak találja a kávét, majd kérik a számlát.\n  [ ] Károly elégedetlen az étellel, és feláll.\n  [ ] A pincér elfelejti kihozni a szendvicset.\n  > A kávéra Meg azt mondja: „Köszönöm. Finom.”, majd a végén kérik a számlát: „Igen, kérem.”\n", "raw": {"id": "story.a1.unit23", "title": "At the Café", "level": "A1", "type": "original", "characters": ["Pincér", "Meg", "Károly"], "paragraphs": [{"type": "narration", "lang": "en", "text": "The group meets at a café. Meg orders in Hungarian."}, {"type": "dialogue", "speaker": "Pincér", "text": "Jó napot kívánok! Itt az étlap."}, {"type": "dialogue", "speaker": "Meg", "text": "Kérek egy kávét és egy teát."}, {"type": "dialogue", "speaker": "Pincér", "text": "Szeretne limonádét vagy üdítőt?"}, {"type": "dialogue", "speaker": "Meg", "text": "Szeretnék egy limonádét. És egy szendvicset kérek."}, {"type": "dialogue", "speaker": "Pincér", "text": "Kér még süteményt?"}, {"type": "dialogue", "speaker": "Meg", "text": "Igen, kérek egy süteményt."}, {"type": "dialogue", "speaker": "Károly", "text": "Én kérek reggelit."}, {"type": "dialogue", "speaker": "Meg", "text": "Kérek cukrot és tejet is."}, {"type": "dialogue", "speaker": "Pincér", "text": "Hozom. Meleg a kávé."}, {"type": "dialogue", "speaker": "Meg", "text": "Köszönöm. Finom."}, {"type": "dialogue", "speaker": "Pincér", "text": "Kérik a számlát?"}, {"type": "dialogue", "speaker": "Meg", "text": "Igen, kérem."}, {"type": "narration", "lang": "en", "text": "The waiter brings coffee, tea, lemonade, and soda. Meg asks for a sandwich, a pastry, and a breakfast plate, along with some sugar and milk."}], "narration": {"pedagogical": {"comprehensionQuestions": [{"question": "Miről szól a beszélgetés a kávézóban?", "options": ["Meg és Károly italokat és ételt rendelnek a pincértől.", "A pincér új munkatársat keres a kávézóba.", "Meg panaszkodik a hideg kávé miatt.", "Károly elmagyarázza az utat a vendégeknek."], "correctIndex": 0, "explanation": "Meg és Károly a kávézóban kávét, teát, limonádét és ételeket rendelnek a pincértől magyarul."}, {"question": "Mit kér Károly a pincértől?", "options": ["Csak egy pohár hideg vizet", "Egy nagy adag süteményt", "Reggelit kér", "Egy fekete teát cukorral"], "correctIndex": 2, "explanation": "Károly ezt mondja: „Én kérek reggelit.” (I'll have breakfast.)"}, {"question": "Mi történik, miután megkapják a rendelést?", "options": ["Meg visszaküldi a meleg kávét a pincérnek.", "Meg finomnak találja a kávét, majd kérik a számlát.", "Károly elégedetlen az étellel, és feláll.", "A pincér elfelejti kihozni a szendvicset."], "correctIndex": 1, "explanation": "A kávéra Meg azt mondja: „Köszönöm. Finom.”, majd a végén kérik a számlát: „Igen, kérem.”"}]}}}}, "a1-unit-24": {"id": "story.a1.unit24", "title": "At the Restaurant", "lesson": null, "level": "A1", "script": "[Károly, Meg, András, Anna and Mariann have a meal together.]\n\nPincér: Jó napot kívánok! Itt az étlap.\nMeg: Szeretnék levest és salátát.\nAndrás: Én csirkét kérek körettel.\nAnna: Én vegetáriánus vagyok. Salátát szeretnék.\nMariann: Éhes vagyok, de nem vagyok szomjas.\nKároly: Kell még valami?\nMeg: Igen, vizet kérek.\nAnna: Desszert is kell.\nMariann: Szeretnék menüt, mert éhes vagyok.\nPincér: Kártya vagy készpénz?\nKároly: Kártya. Fizetek.\nMeg: Köszönöm.\n[The set menu has soup, salad, a side dish, and dessert. András orders chicken, Mariann orders beef, and Anna, who is vegetarian, has the salad. Károly pays with a card.]\n\n\n=== QUESTIONS ===\n\n1. Hol vannak és mit csinálnak a barátok?\n  [ ] Moziban új magyar filmet néznek.\n  [x] Egy étteremben közösen rendelnek és étkeznek.\n  [ ] A piacon zöldségeket árulnak a standoknál.\n  [ ] Egy ruhaboltban próbálnak fel kabátokat.\n  > A barátok (Károly, Meg, András, Anna, Mariann) egy étteremben ülnek, és ételt rendelnek az étlapról.\n\n2. Miért salátát kér Anna az étteremben?\n  [ ] Mert nem éhes, csak szomjas.\n  [ ] Mert elfogyott a csirke az étlapról.\n  [x] Mert vegetáriánus, és nem eszik húst.\n  [ ] Mert a pincér ezt ajánlja a menüben.\n  > Anna kifejezetten mondja: „Én vegetáriánus vagyok. Salátát szeretnék.” (I am vegetarian. I would like salad.)\n\n3. Hogyan rendezi Károly a számlát az étkezés végén?\n  [ ] Készpénzzel fizet a pincérnek.\n  [ ] Mindenki külön fizeti a saját részét.\n  [ ] Meg rendezi az egész számlát készpénzben.\n  [x] Károly bankkártyával fizet.\n  > A pincér kérdésére („Kártya vagy készpénz?”) Károly válaszol: „Kártya. Fizetek.” (Card. I'll pay.)\n", "raw": {"id": "story.a1.unit24", "title": "At the Restaurant", "level": "A1", "type": "original", "characters": ["Pincér", "Meg", "András", "Anna", "Mariann", "Károly"], "paragraphs": [{"type": "narration", "lang": "en", "tex egetarian. I would like salad.)"}, {"question": "Hogyan rendezi Károly a számlát az étkezés végén?", "options": ["Készpénzzel fizet a pincérnek.", "Mindenki külön fizeti a saját részét.", "Meg rendezi az egész számlát készpénzben.", "Károly bankkártyával fizet."], "correctIndex": 3, "explanation": "A pincér kérdésére („Kártya vagy készpénz?”) Károly válaszol: „Kártya. Fizetek.” (Card. I'll pay.)"}]}}}}, "a1-unit-25": {"id": "story.a1.unit25", "title": "Shopping", "lesson": null, "level": "A1", "script": "[Meg and Károly go to a shop to buy something practical.]\n\nEladó: Jó napot kívánok! Mit keres?\nMeg: Egy pólót és egy táskát keresek.\nKároly: Ez a termék jó?\nMeg: Igen, tetszik. Milyen a méret?\nEladó: Nagy vagy kicsi?\nMeg: A nagy jó. Milyen a szín?\nEladó: Piros, kék, fekete és fehér van.\nMeg: A kék pólót kérem. Mennyi az ár?\nEladó: Tíz forint.\nMeg: Rendben. A táska is ajándék?\nKároly: Nem, az ajándék külön van.\n\n=== QUESTIONS ===\n\n1. Mit szeretne vásárolni Meg az üzletben?\n  [ ] Egy könyvet és egy tollat\n  [x] Egy pólót és egy táskát\n  [ ] Egy téli kabátot és sálat\n  [ ] Egy cipőt és zoknit\n  > Meg ezt mondja az eladónak: „Egy pólót és egy táskát keresek.” (I am looking for a T-shirt and a bag.)\n\n2. Milyen színű és méretű pólót választ Meg?\n  [ ] Kicsi méretű fehér pólót\n  [ ] Nagy méretű piros pólót\n  [ ] Közepes méretű fekete pólót\n  [x] Nagy méretű kék pólót\n  > Meg kiválasztja a méretet és a színt: „A nagy jó.” és „A kék pólót kérem.” (The big one is good; The blue T-shirt, please.)\n\n3. Mennyibe kerül a kiválasztott termék az eladó szerint?\n  [x] Tíz forintba kerül.\n  [ ] Öt forintba kerül.\n  [ ] Húsz forintba kerül.\n  [ ] Ingyenes ajándék a vásárlóknak.\n  > Meg kérdésére az eladó egyértelműen válaszol: „Tíz forint.” (Ten forints.)\n", "raw": {"id": "story.a1.unit25", "title": "Shopping", "level": "A1", "type": "original", "characters": ["Eladó", "Meg", "Károly"], "paragraphs": [{"type": "narration", "lang": "en", "text": "Meg and Károly go to a shop to buy something practical."}, {"type": "dialogue", "speaker": "Eladó", "text": "Jó napot kívánok! Mit keres?"}, {"type": "dialogue", "speaker": "Meg", "text": "Egy pólót és egy táskát keresek."}, {"type": "dialogue", "speaker": "Károly", "text": "Ez a termék jó?"}, {"type": "dialogue", "speaker": "Meg", "text": "Igen, tetszik. Milyen a méret?"}, {"type": "dialogue", "speaker": "Eladó", "text": "Nagy vagy kicsi?"}, {"type": "dialogue", "speaker": "Meg", "text": "A nagy jó. Milyen a szín?"}, {"type": "dialogue", "speaker": "Eladó", "text": "Piros, kék, fekete és fehér van."}, {"type": "dialogue", "speaker": "Meg", "text": "A kék pólót kérem. Mennyi az ár?"}, {"type": "dialogue", "speaker": "Eladó", "text": "Tíz forint."}, {"type": "dialogue", "speaker": "Meg", "text": "Rendben. A táska is ajándék?"}, {"type": "dialogue", "speaker": "Károly", "text": "Nem, az ajándék külön van."}], "narration": {"pedagogical": {"comprehensionQuestions": [{"question": "Mit szeretne vásárolni Meg az üzletben?", "options": ["Egy könyvet és egy tollat", "Egy pólót és egy táskát", "Egy téli kabátot és sálat", "Egy cipőt és zoknit"], "correctIndex": 1, "explanation": "Meg ezt mondja az eladónak: „Egy pólót és egy táskát keresek.” (I am looking for a T-shirt and a bag.)"}, {"question": "Milyen színű és méretű pólót választ Meg?", "options": ["Kicsi méretű fehér pólót", "Nagy méretű piros pólót", "Közepes méretű fekete pólót", "Nagy méretű kék pólót"], "correctIndex": 3, "explanation": "Meg kiválasztja a méretet és a színt: „A nagy jó.” és „A kék pólót kérem.” (The big one is good; The blue T-shirt, please.)"}, {"question": "Mennyibe kerül a kiválasztott termék az eladó szerint?", "options": ["Tíz forintba kerül.", "Öt forintba kerül.", "Húsz forintba kerül.", "Ingyenes ajándék a vásárlóknak."], "correctIndex": 0, "explanation": "Meg kérdésére az eladó egyértelműen válaszol: „Tíz forint.” (Ten forints.)"}]}}}}, "a1-unit-26": {"id": "story.a1.unit26", "title": "Clothes & Appearance", "lesson": null, "level": "A1", "script": "[Károly, Meg, Anna and Mariann talk about clothes and choose something to wear.]\n\nAnna: Szép ez a ruha.\nMeg: Igen. A szoknya is szép.\nMariann: Én inget és pulóvert viselek.\nKároly: A kabát hosszú, de kényelmes.\nMeg: A nadrág rövid?\nKároly: Nem, a nadrág hosszú.\nAnna: Ez a zokni színes.\nMeg: A sapka világos vagy sötét?\nMariann: Sötét. A csizma is sötét.\nMeg: Szeretném felpróbálni a cipőt.\nAnna: Ez csúnya, de az szép.\nMeg: Rendben, ezt viselem.\n\n=== QUESTIONS ===\n\n1. Miről beszélgetnek a szereplők a szövegben?\n  [x] Különféle ruhadarabokról és a kinézetükről.\n  [ ] Egy új könyvről és az írójáról.\n  [ ] A hétvégi bevásárlás árairól.\n  [ ] A budapesti vonatok menetrendjéről.\n  > A barátok ruhadarabokról (ruha, szoknya, ing, pulóver, nadrág, csizma) beszélnek, és ruhát választanak.\n\n2. Mit visel Mariann a történet szerint?\n  [ ] Szoknyát és kabátot\n  [x] Inget és pulóvert\n  [ ] Rövid nadrágot és sapkát\n  [ ] Ruhát és világos csizmát\n  > Mariann kijelenti: „Én inget és pulóvert viselek.” (I wear a shirt and a sweater.)\n\n3. Milyen a nadrág és a csizma a leírás alapján?\n  [ ] A nadrág rövid, a csizma pedig fehér.\n  [ ] A nadrág szűk, a csizma pedig kényelmetlen.\n  [x] A nadrág hosszú, a csizma pedig sötét.\n  [ ] A nadrág színes, a csizma pedig világos.\n  > Károly szerint „a nadrág hosszú”, Mariann szerint pedig „A csizma is sötét.” (The trousers are long; The boots are dark too.)\n", "raw": {"id": "story.a1.unit26", "title": "Clothes & Appearance", "level": "A1", "type": "original", "characters": ["Anna", "Meg", "Mariann", "Károly"], "paragraphs": [{"type": "narration", "lang": "en", "text": "Károly, Meg, Anna and Mariann talk about clothes and choose something to wear."}, {"type": "dialogue", "speaker": "Anna", "text": "Szép ez a ruha."}, {"type": "dialogue", "speaker": "Meg", "text": "Igen. A szoknya is szép."}, {"type": "dialogue", "speaker": "Mariann", "text": "Én inget és pulóvert viselek."}, {"type": "dialogue", "speaker": "Károly", "text": "A kabát hosszú, de kényelmes."}, {"type": "dialogue", "speaker": "Meg", "text": "A nadrág rövid?"}, {"type": "dialogue", "speaker": "Károly", "text": "Nem, a nadrág hosszú."}, {"type": "dialogue", "speaker": "Anna", "text": "Ez a zokni színes."}, {"type": "dialogue", "speaker": "Meg", "text": "A sapka világos vagy sötét?"}, {"type": "dialogue", "speaker": "Mariann", "text": "Sötét. A csizma is sötét."}, {"type": "dialogue", "speaker": "Meg", "text": "Szeretném felpróbálni a cipőt."}, {"type": "dialogue", "speaker": "Anna", "text": "Ez csúnya, de az szép."}, {"type": "dialogue", "speaker": "Meg", "text": "Rendben, ezt viselem."}], "narration": {"pedagogical": {"comprehensionQuestions": [{"question": "Miről beszélgetnek a szereplők a szövegben?", "options": ["Különféle ruhadarabokról és a kinézetükről.", "Egy új könyvről és az írójáról.", "A hétvégi bevásárlás árairól.", "A budapesti vonatok menetrendjéről."], "correctIndex": 0, "explanation": "A barátok ruhadarabokról (ruha, szoknya, ing, pulóver, nadrág, csizma) beszélnek, és ruhát választanak."}, {"question": "Mit visel Mariann a történet szerint?", "options": ["Szoknyát és kabátot", "Inget és pulóvert", "Rövid nadrágot és sapkát", "Ruhát és világos csizmát"], "correctIndex": 1, "explanation": "Mariann kijelenti: „Én inget és pulóvert viselek.” (I wear a shirt and a sweater.)"}, {"question": "Milyen a nadrág és a csizma a leírás alapján?", "options": ["A nadrág rövid, a csizma pedig fehér.", "A nadrág szűk, a csizma pedig kényelmetlen.", "A nadrág hosszú, a csizma pedig sötét.", "A nadrág színes, a csizma pedig világos."], "correctIndex": 2, "explanation": "Károly szerint „a nadrág hosszú”, Mariann szerint pedig „A csizma is sötét.” (The trousers are long; The boots are dark too.)"}]}}}}, "a1-unit-27": {"id": "story.a1.unit27", "title": "The City", "lesson": null, "level": "A1", "script": "[Meg is learning to move around the city more independently.]\n\nMeg: Hol van a bank?\nMariann: A bank közel van. A posta is közel van.\nMeg: Hová megyünk?\nMariann: Az állomásra megyünk.\nMeg: A gyógyszertár hol van?\nMariann: A bolt mellett van.\nMeg: És az iskola?\nMariann: Az utca végén van.\nMeg: Van itt park?\nMariann: Igen, a park közel van. A kórház messze van.\nMeg: A múzeum és a mozi is itt van?\nMariann: Igen. A könyvtár a téren van.\n\n=== QUESTIONS ===\n\n1. Mit csinál Meg és Mariann a városban?\n  [ ] Éttermet keresnek az esti vacsorához.\n  [x] Városi épületek és helyszínek elhelyezkedéséről tájékozódnak.\n  [ ] A repülőtérre sietnek taxival.\n  [ ] Egy múzeumban néznek kiállítást.\n  > Meg a városi épületek (bank, posta, gyógyszertár, iskola, park, könyvtár) elhelyezkedéséről kérdezi Mariannt.\n\n2. Hol található a gyógyszertár Mariann szerint?\n  [ ] A múzeum mögött\n  [ ] Az utca végén\n  [x] A bolt mellett\n  [ ] A kórházban\n  > Meg kérdésére Mariann válaszol: „A bolt mellett van.” (It is next to the shop.)\n\n3. Hová mennek konkrétan a szereplők?\n  [x] Az állomásra mennek.\n  [ ] A távoli kórházba indulnak.\n  [ ] A könyvtárba sétálnak.\n  [ ] Egyenesen a moziba mennek.\n  > Arra a kérdésre, hogy „Hová megyünk?”, Mariann így felel: „Az állomásra megyünk.” (We are going to the station.)\n", "raw": {"id": "story.a1.unit27", "title": "The City", "level": "A1", "type": "original", "characters": ["Meg", "Mariann"], "paragraphs": [{"type": "narration", "lang": "en", "text": "Meg is learning to move around the city more independently."}, {"type": "dialogue", "speaker": "Meg", "text": "Hol van a bank?"}, {"type": "dialogue", "speaker": "Mariann", "text": "A bank közel van. A posta is közel van."}, {"type": "dialogue", "speaker": "Meg", "text": "Hová megyünk?"}, {"type": "dialogue", "speaker": "Mariann", "text": "Az állomásra megyünk."}, {"type": "dialogue", "speaker": "Meg", "text": "A gyógyszertár hol van?"}, {"type": "dialogue", "speaker": "Mariann", "text": "A bolt mellett van."}, {"type": "dialogue", "speaker": "Meg", "text": "És az iskola?"}, {"type": "dialogue", "speaker": "Mariann", "text": "Az utca végén van."}, {"type": "dialogue", "speaker": "Meg", "text": "Van itt park?"}, {"type": "dialogue", "speaker": "Mariann", "text": "Igen, a park közel van. A kórház messze van."}, {"type": "dialogue", "speaker": "Meg", "text": "A múzeum és a mozi is itt van?"}, {"type": "dialogue", "speaker": "Mariann", "text": "Igen. A könyvtár a téren van."}], "narration": {"pedagogical": {"comprehensionQuestions": [{"question": "Mit csinál Meg és Mariann a városban?", "options": ["Éttermet keresnek az esti vacsorához.", "Városi épületek és helyszínek elhelyezkedéséről tájékozódnak.", "A repülőtérre sietnek taxival.", "Egy múzeumban néznek kiállítást."], "correctIndex": 1, "explanation": "Meg a városi épületek (bank, posta, gyógyszertár, iskola, park, könyvtár) elhelyezkedéséről kérdezi Mariannt."}, {"question": "Hol található a gyógyszertár Mariann szerint?", "options": ["A múzeum mögött", "Az utca végén", "A bolt mellett", "A kórházban"], "correctIndex": 2, "explanation": "Meg kérdésére Mariann válaszol: „A bolt mellett van.” (It is next to the shop.)"}, {"question": "Hová mennek konkrétan a szereplők?", "options": ["Az állomásra mennek.", "A távoli kórházba indulnak.", "A könyvtárba sétálnak.", "Egyenesen a moziba mennek."], "correctIndex": 0, "explanation": "Arra a kérdésre, hogy „Hová megyünk?”, Mariann így felel: „Az állomásra megyünk.” (We are going to the station.)"}]}}}}, "a1-unit-28": {"id": "story.a1.unit28", "title": "Transport & Directions", "lesson": null, "level": "A1", "script": "[Meg and Mariann travel across Budapest and have a small navigation problem.]\n\nMeg: Mivel megyünk?\nMariann: Busszal vagy villamossal.\nMeg: Van jegyünk?\nMariann: Igen. A megálló ott van.\nMeg: A metróval megyünk?\nMariann: Nem, most busszal utazunk.\nMeg: Hol a pályaudvar?\nMariann: Menj egyenesen, aztán jobbra.\nMeg: És a taxi?\nMariann: A taxi balra van.\nMeg: Mikor indul a vonat?\nMariann: Hamarosan. Mi felszállunk, aztán te leszállsz.\nMeg: Mikor érkezünk?\nMariann: Hamarosan. Jön a busz.\n\n=== QUESTIONS ===\n\n1. Milyen témáról beszélget Meg és Mariann?\n  [ ] Egy kávézó kínálatáról és az ételekről.\n  [x] Városi közlekedésről, járművekről és útirányról.\n  [ ] Hétvégi sportolásról a szabadban.\n  [ ] Egy lakás felújításáról és rendezéséről.\n  > Meg és Mariann budapesti közlekedésről, járművekről (busz, metró, taxi, vonat) és az útirányról beszélgetnek.\n\n2. Milyen járművel utaznak most a metró helyett?\n  [x] Busszal utaznak.\n  [ ] Metróval utaznak.\n  [ ] Kerékpárral mennek.\n  [ ] Taxival utaznak.\n  > Mariann tisztázza: „Nem, most busszal utazunk.” (No, we are traveling by bus now.)\n\n3. Hogyan lehet eljutni a pályaudvarra Mariann útbaigazítása szerint?\n  [ ] Menj balra, aztán rögtön fordulj vissza.\n  [ ] Fordulj kétszer balra a tér után.\n  [ ] Csak taxival vagy villamossal lehet odaérni.\n  [x] Menj egyenesen, aztán jobbra.\n  > A pályaudvar felé Mariann így ad útbaigazítást: „Menj egyenesen, aztán jobbra.” (Go straight, then right.)\n", "raw": {"id": "story.a1.unit28", "title": "Transport & Directions", "level": "A1", "type": "original", "characters": ["Meg", "Mariann"], "paragraphs": [{"type": "narration", "lang": "en", "text": "Meg and Mariann travel across Budapest and have a small navigation problem."}, {"type": "dialogue", "speaker": "Meg", "text": "Mivel megyünk?"}, {"type": "dialogue", "speaker": "Mariann", "text": "Busszal vagy villamossal."}, {"type": "dialogue", "speaker": "Meg", "text": "Van jegyünk?"}, {"type": "dialogue", "speaker": "Mariann", "text": "Igen. A megálló ott van."}, {"type": "dialogue", "speaker": "Meg", "text": "A metróval megyünk?"}, {"type": "dialogue", "speaker": "Mariann", "text": "Nem, most busszal utazunk."}, {"type": "dialogue", "speaker": "Meg", "text": "Hol a pályaudvar?"}, {"type": "dialogue", "speaker": "Mariann", "text": "Menj egyenesen, aztán jobbra."}, {"type": "dialogue", "speaker": "Meg", "text": "És a taxi?"}, {"type": "dialogue", "speaker": "Mariann", "text": "A taxi balra van."}, {"type": "dialogue", "speaker": "Meg", "text": "Mikor indul a vonat?"}, {"type": "dialogue", "speaker": "Mariann", "text": "Hamarosan. Mi felszállunk, aztán te leszállsz."}, {"type": "dialogue", "speaker": "Meg", "text": "Mikor érkezünk?"}, {"type": "dialogue", "speaker": "Mariann", "text": "Hamarosan. Jön a busz."}], "narration": {"pedagogical": {"comprehensionQuestions": [{"question": "Milyen témáról beszélget Meg és Mariann?", "options": ["Egy kávézó kínálatáról és az ételekről.", "Városi közlekedésről, járművekről és útirányról.", "Hétvégi sportolásról a szabadban.", "Egy lakás felújításáról és rendezéséről."], "correctIndex": 1, "explanation": "Meg és Mariann budapesti közlekedésről, járművekről (busz, metró, taxi, vonat) és az útirányról beszélgetnek."}, {"question": "Milyen járművel utaznak most a metró helyett?", "options": ["Busszal utaznak.", "Metróval utaznak.", "Kerékpárral mennek.", "Taxival utaznak."], "correctIndex": 0, "explanation": "Mariann tisztázza: „Nem, most busszal utazunk.” (No, we are traveling by bus now.)"}, {"question": "Hogyan lehet eljutni a pályaudvarra Mariann útbaigazítása szerint?", "options": ["Menj balra, aztán rögtön fordulj vissza.", "Fordulj kétszer balra a tér után.", "Csak taxival vagy villamossal lehet odaérni.", "Menj egyenesen, aztán jobbra."], "correctIndex": 3, "explanation": "A pályaudvar felé Mariann így ad útbaigazítást: „Menj egyenesen, aztán jobbra.” (Go straight, then right.)"}]}}}}, "a1-unit-29": {"id": "story.a1.unit29", "title": "Hobbies & Free Time", "lesson": null, "level": "A1", "script": "[The friends talk about free time and discover activities they enjoy together.]\n\nKároly: Mit csinálsz szabadidőben?\nMeg: Szeretek sportolni. Szeretem az úszást és a futást.\nAnna: Én a focit szeretem.\nAndrás: Szeretem a zenét és a filmeket.\nMariann: Szeretek olvasni.\nMeg: Szeretsz táncolni?\nKároly: Igen, szeretek táncolni.\nAnna: Én szeretek kirándulni.\nAndrás: Találkozunk a hétvégén?\nMeg: Igen, együtt.\nMariann: Én játszani is szeretek.\nKároly: Én szeretek filmet nézni és zenét hallgatni.\n\n=== QUESTIONS ===\n\n1. Miről beszélgetnek a barátok a történetben?\n  [ ] A munkahelyi nehézségeikről és a pénzről.\n  [ ] Egy tervezett külföldi utazás költségeiről.\n  [x] A szabadidős hobbijaikról és a kedvenc időtöltéseikről.\n  [ ] Egy elveszett vonatjegyről az állomáson.\n  > A barátok sorra elmesélik, mit szeretnek csinálni a szabadidejükben (sport, zene, olvasás, tánc, kirándulás).\n\n2. Milyen sportot szeret Meg a szöveg szerint?\n  [ ] A teniszt és a kosárlabdát\n  [x] Az úszást és a futást\n  [ ] A focit és a síelést\n  [ ] Csak a kerékpározást\n  > Meg mondja: „Szeretek sportolni. Szeretem az úszást és a futást.” (I like sports. I like swimming and running.)\n\n3. Mit terveznek a barátok a hétvégére?\n  [x] Találkoznak és együtt töltenek időt.\n  [ ] Mindenki otthon marad egyedül olvasni.\n  [ ] Nem érnek rá, mert dolgozniuk kell.\n  [ ] Különböző városokba utaznak el vonattal.\n  > András kérdésére („Találkozunk a hétvégén?”) Meg örömmel felel: „Igen, együtt.” (Yes, together.)\n", "raw": {"id": "story.a1.unit29", "title": "Hobbies & Free Time", "level": "A1", "type": "original", "characters": ["Károly", "Meg", "Anna", "András", "Mariann"], "paragraphs": [{"type": "narration", "lang": "en", "text": "The friends talk about free time and discover activities they enjoy together."}, {"type": "dialogue", "speaker": "Károly", "text": "Mit csinálsz szabadidőben?"}, {"type": "dialogue", "speaker": "Meg", "text": "Szeretek sportolni. Szeretem az úszást és a futást."}, {"type": "dialogue", "speaker": "Anna", "text": "Én a focit szeretem."}, {"type": "dialogue", "speaker": "András", "text": "Szeretem a zenét és a filmeket."}, {"type": "dialogue", "speaker": "Mariann", "text": "Szeretek olvasni."}, {"type": "dialogue", "speaker": "Meg", "text": "Szeretsz táncolni?"}, {"type": "dialogue", "speaker": "Károly", "text": "Igen, szeretek táncolni."}, {"type": "dialogue", "speaker": "Anna", "text": "Én szeretek kirándulni."}, {"type": "dialogue", "speaker": "András", "text": "Találkozunk a hétvégén?"}, {"type": "dialogue", "speaker": "Meg", "text": "Igen, együtt."}, {"type": "dialogue", "speaker": "Mariann", "text": "Én játszani is szeretek."}, {"type": "dialogue", "speaker": "Károly", "text": "Én szeretek filmet nézni és zenét hallgatni."}], "narration": {"pedagogical": {"comprehensionQuestions": [{"question": "Miről beszélgetnek a barátok a történetben?", "options": ["A munkahelyi nehézségeikről és a pénzről.", "Egy tervezett külföldi utazás költségeiről.", "A szabadidős hobbijaikról és a kedvenc időtöltéseikről.", "Egy elveszett vonatjegyről az állomáson."], "correctIndex": 2, "explanation": "A barátok sorra elmesélik, mit szeretnek csinálni a szabadidejükben (sport, zene, olvasás, tánc, kirándulás)."}, {"question": "Milyen sportot szeret Meg a szöveg szerint?", "options": ["A teniszt és a kosárlabdát", "Az úszást és a futást", "A focit és a síelést", "Csak a kerékpározást"], "correctIndex": 1, "explanation": "Meg mondja: „Szeretek sportolni. Szeretem az úszást és a futást.” (I like sports. I like swimming and running.)"}, {"question": "Mit terveznek a barátok a hétvégére?", "options": ["Találkoznak és együtt töltenek időt.", "Mindenki otthon marad egyedül olvasni.", "Nem érnek rá, mert dolgozniuk kell.", "Különböző városokba utaznak el vonattal."], "correctIndex": 0, "explanation": "András kérdésére („Találkozunk a hétvégén?”) Meg örömmel felel: „Igen, együtt.” (Yes, together.)"}]}}}}, "a1-unit-30": {"id": "story.a1.unit30", "title": "Friends & Making Plans", "lesson": null, "level": "A1", "script": "[The group wants to make a plan for a shared activity.]\n\nKároly: Van egy tervem. Szeretnétek együtt programot?\nMeg: Igen. Mikor találkozunk?\nAnna: Holnap délután jó?\nMariann: Nekem nem jó délután, de este ráérek.\nAndrás: Nekem is jó az este.\nKároly: Akarunk találkozni hétkor?\nMeg: Igen, szeretnék.\nAnna: Nekem hét óra jó.\nMariann: Lehet nyolc óra?\nKároly: Igen, lehet.\nAndrás: Hol találkozunk?\nKároly: A téren. Ez a program.\nMeg: Jó. Akkor együtt megyünk.\n\n=== QUESTIONS ===\n\n1. Mi a célja a csoport beszélgetésének?\n  [x] Megtervezni egy közös találkozót és megegyezni az időpontban.\n  [ ] Eladni egy régi asztalt és széket a lakásból.\n  [ ] Felkészülni egy nehéz egyetemi vizsgára.\n  [ ] Megkeresni egy elhagyott táskát a villamoson.\n  > A barátok egy közös esti programot szerveznek, és megegyeznek a pontos időben és helyszínben.\n\n2. Miért nem jó Mariann-nak a délutáni időpont?\n  [ ] Mert elutazik egy másik városba.\n  [x] Mert délután nem ér rá, csak este.\n  [ ] Mert délután mindig alszik.\n  [ ] Mert nem akar találkozni a barátaival.\n  > Mariann magyarázata: „Nekem nem jó délután, de este ráérek.” (Afternoon is not good for me, but I am free in the evening.)\n\n3. Végül mikor és hol találkoznak a barátok?\n  [ ] Hét órakor az iskolánál\n  [ ] Délután háromkor egy kávézóban\n  [x] Nyolc órakor a téren\n  [ ] Kilenc órakor a vasútállomáson\n  > Mariann kérdésére („Lehet nyolc óra?”) Károly beleegyezik, a helyszín pedig a tér: „A téren. Ez a program.”\n", "raw": {"id": "story.a1.unit30", "title": "Friends & Making Plans", "level": "A1", "type": "original", "characters": ["Károly", "Meg", "Anna", "Mariann", "András"], "paragraphs": [{"type": "narration", "lang": "en", "text": "The group wants to make a plan for a shared activity."}, {"type": "dialogue", "speaker": "Károly", "text": "Van egy tervem. Szeretnétek együtt programot?"}, {"type": "dialogue", "speaker": "Meg", "text": "Igen. Mikor találkozunk?"}, {"type": "dialogue", "speaker": "Anna", "text": "Holnap délután jó?"}, {"type": "dialogue", "speaker": "Mariann", "text": "Nekem nem jó délután, de este ráérek."}, {"type": "dialogue", "speaker": "András", "text": "Nekem is jó az este."}, {"type": "dialogue", "speaker": "Károly", "text": "Akarunk találkozni hétkor?"}, {"type": "dialogue", "speaker": "Meg", "text": "Igen, szeretnék."}, {"type": "dialogue", "speaker": "Anna", "text": "Nekem hét óra jó."}, {"type": "dialogue", "speaker": "Mariann", "text": "Lehet nyolc óra?"}, {"type": "dialogue", "speaker": "Károly", "text": "Igen, lehet."}, {"type": "dialogue", "speaker": "András", "text": "Hol találkozunk?"}, {"type": "dialogue", "speaker": "Károly", "text": "A téren. Ez a program."}, {"type": "dialogue", "speaker": "Meg", "text": "Jó. Akkor együtt megyünk."}], "narration": {"pedagogical": {"comprehensionQuestions": [{"question": "Mi a célja a csoport beszélgetésének?", "options": ["Megtervezni egy közös találkozót és megegyezni az időpontban.", "Eladni egy régi asztalt és széket a lakásból.", "Felkészülni egy nehéz egyetemi vizsgára.", "Megkeresni egy elhagyott táskát a villamoson."], "correctIndex": 0, "explanation": "A barátok egy közös esti programot szerveznek, és megegyeznek a pontos időben és helyszínben."}, {"question": "Miért nem jó Mariann-nak a délutáni időpont?", "options": ["Mert elutazik egy másik városba.", "Mert délután nem ér rá, csak este.", "Mert délután mindig alszik.", "Mert nem akar találkozni a barátaival."], "correctIndex": 1, "explanation": "Mariann magyarázata: „Nekem nem jó délután, de este ráérek.” (Afternoon is not good for me, but I am free in the evening.)"}, {"question": "Végül mikor és hol találkoznak a barátok?", "options": ["Hét órakor az iskolánál", "Délután háromkor egy kávézóban", "Nyolc órakor a téren", "Kilenc órakor a vasútállomáson"], "correctIndex": 2, "explanation": "Mariann kérdésére („Lehet nyolc óra?”) Károly beleegyezik, a helyszín pedig a tér: „A téren. Ez a program.”"}]}}}}, "a1-unit-31": {"id": "story.a1.unit31", "title": "Honnan jöttök?", "lesson": null, "level": "A1", "script": "[Károly meets Meg and Anna at a café in Budapest after their weekend trips.]\n\nKároly: Sziasztok! De jó látni titeket! Honnan jöttök?\nMeg: Szia Károly! Én most érkeztem a repülőtérről.\nKároly: A repülőtérről? Hol voltál hétvégén?\nMeg: Bécsben voltam. Nagyon szép volt a város.\nAnna: Én Szegedről jövök, a vasútállomásról egyenesen ide sétáltam.\nKároly: Szegedről? És hoztál valamit?\nAnna: Igen! Hoztam finom szegedi paprikát a piacról.\nMeg: Nézzétek, a táskámból előveszek egy kis csokoládét Bécsből.\nKároly: Köszönöm szépen! Üljünk le, és meséljetek az utazásról!\n\n=== QUESTIONS ===\n\n1. Miről mesél Meg és Anna Károlynak a kávézóban?\n  [ ] Egy új egyetemi kurzusról és a vizsgákról.\n  [x] A hétvégi utazásaikról és az onnan hozott finomságokról.\n  [ ] A budapesti albérletek magas bérleti díjáról.\n  [ ] Egy elromlott repülőgépről a Liszt Ferenc repülőtéren.\n  > A lányok a hétvégi útjaikról (Meg Bécsben, Anna Szegeden járt) és a hozott ajándékokról beszélnek.\n\n2. Mit hozott Anna Szegedről a barátoknak?\n  [ ] Egy képeskönyvet a városról\n  [ ] Bécsi csokoládét egy cukrászdából\n  [x] Szegedi paprikát a piacról\n  [ ] Friss kenyeret a vasútállomásról\n  > Anna büszkén meséli: „Hoztam finom szegedi paprikát a piacról.” (I brought delicious paprika from Szeged from the market.)\n\n3. Mit vesz elő Meg a táskájából az asztalnál?\n  [x] Egy kis csokoládét Bécsből\n  [ ] Friss narancslevet Budapestről\n  [ ] Finom sajtot a szegedi piacról\n  [ ] Egy doboz süteményt a repülőtérről\n  > Meg előveszi a meglepetést: „Nézzétek, a táskámból előveszek egy kis csokoládét Bécsből.” (Look, from my bag I take out a little chocolate from Vienna.)\n", "raw": {"id": "story.a1.unit31", "title": "Honnan jöttök?", "level": "A1", "type": "original", "characters": ["Károly", "Meg", "Anna"], "paragraphs": [{"type": "narration", "lang": "en", "text": "Károly meets Meg and Anna at a café in Budapest after their weekend trips."}, {"type": "dialogue", "speaker": "Károly", "text": "Sziasztok! De jó látni titeket! Honnan jöttök?"}, {"type": "dialogue", "speaker": "Meg", "text": "Szia Károly! Én most érkeztem a repülőtérről."}, {"type": "dialogue", "speaker": "Károly", "  null, "level": "A1", "script": "[Meg and Károly meet at a quiet café near Deák square for a language exchange session.]\n\nKároly: Szia Meg! Kezdhetjük a nyelvgyakorlást?\nMeg: Szia Károly! Igen, nagyon szeretnék magyarul beszélni.\nKároly: Nagyszerű! Hogy érzed magad ma?\nMeg: Köszönöm, jól vagyok. Egy kicsit fáradt vagyok, de készen állok.\nAnna: Sziasztok! Csatlakozhatok? Én spanyolul tanulok, de angolul is gyakorolhatunk.\nKároly: Persze, gyere Anna! Meg angolul segít neked, mi meg magyarul segítünk Megnek.\nMeg: Károly, hogy mondják magyarul: 'I would like an orange juice'?\nKároly: Úgy mondják: 'Egy narancslevet kérek szépen'.\nMeg: Egy narancslevet kérek szépen... Köszönöm! Már sok új szót tudok magyarul.\nAnna: Nagyon ügyes vagy Meg, egyre jobban beszélsz!\n\n=== QUESTIONS ===\n\n1. Miért találkozik Meg, Károly és Anna a kávézóban?\n  [x] Hogy nyelveket gyakoroljanak és segítsenek egymásnak a tanulásban.\n  [ ] Hogy állásinterjút tartsanak egy nemzetközi cégnél.\n  [ ] Hogy panaszt tegyenek a pincérnél a hideg kávé miatt.\n  [ ] Hogy spanyol nyelvvizsgát írjanak az egyetemen.\n  > A barátok nyelvcsere céljából találkoznak a kávézóban (Meg angolul segít Annának, ők pedig magyarul segítenek Megnek).\n\n2. Mit szeretne megtanulni Meg mondani magyarul?\n  [ ] Azt, hogy hol van a vasútállomás.\n  [ ] Azt, hogy kérek egy kávét cukorral és tejjel.\n  [x] Azt, hogy szeretne egy narancslevet kérni.\n  [ ] Azt, hogy mennyi az idő most délután.\n  > Meg kérdezi: „Károly, hogy mondják magyarul: 'I would like an orange juice'?” Károly megtanítja: „Egy narancslevet kérek szépen.”\n\n3. Mit mond Anna Megnek a nyelvgyakorlás végén?\n  [ ] Hogy még túl nehéz neki a magyar nyelv.\n  [ ] Hogy inkább csak angolul beszéljen a kávézóban.\n  [ ] Hogy nem értette a kiejtését.\n  [x] Hogy nagyon ügyes, és egyre jobban beszél.\n  > Anna dicséri Meg fejlődését: „Nagyon ügyes vagy Meg, egyre jobban beszélsz!” (You are very skilled Meg, you speak better and better!)\n", "raw": {"id": " gy kartondobozt és egy lámpát.\n  [ ] A könyvét és a vonatjegyét.\n  [ ] Egy poharat és a telefonját.\n  > Meg az asztal alá néz: „Nem, az asztal alatt csak a cipőm van.” (No, under the table there is only my shoe.)\n\n3. Hol találják meg végül a vonatjegyet?\n  [ ] A szék mellett a szőnyegen\n  [ ] A nagy doboz mögött a szobában\n  [ ] A kabát belső zsebében\n  [x] A könyv alatt az asztalon\n  > A jegy a könyv alatt rejtőzött: „Itt van! A könyv alatt volt az asztalon!” (It is here! It was under the book on the table!)\n", "raw": {"id": "story.a1.unit33", "title": "Hol van a jegy?", "level": "A1", "type": "original", "characters": ["Károly", "Meg"], "paragraphs": [{"type": "narration", "lang": "en", "text": "Meg and Károly are preparing to leave their apartment for Keleti railway station, but Meg cannot find her train ticket."}, {"type": "dialogue", "speaker": "Meg", "text": "Károly! Baj van, nem találom a vonatjegyet!"}, {"type": "dialogue", "speaker": "Károly", "text": "Nyugodj meg, Meg! Hol láttad utoljára?"}, {"type": "dialogue", "speaker": "Meg", "text": "Azt hiszem, az asztalra tettem az ebéd után."}, {"type": "dialogue", "speaker": "Károly", "text": "Nézd meg az asztal alatt! Leesett a földre?"}, {"type": "dialogue", "speaker": "Meg", "text": "Nem, az asztal alatt csak a cipőm van."}, {"type": "dialogue", "speaker": "Károly", "text": "És a szék mellett? Vagy a nagy doboz mögött?"}, {"type": "dialogue", "speaker": "Meg", "text": "A doboz mögött sincs... Várj! Mi van a lámpa mellett?"}, {"type": "dialogue", "speaker": "Károly", "text": "A lámpa mellett csak a könyved van. De nézd, mi van a könyv alatt!"}, {"type": "dialogue", "speaker": "Meg", "text": "Itt van! A könyv alatt volt az asztalon!"}, {"type": "dialogue", "speaker": "Károly", "text": "Szuper! Most már indulhatunk a vasútállomásra."}], "narration": {"pedagogical": {"comprehensionQuestions": [{"question": "Mi Meg problémája a történet elején?", "options": ["Nem találja a lakáskulcsát a táskájában.", "Elvesztette a pénztárcáját a metrón.", "Nem találja a vonatjegyet az indulás előtt.", "Elkésik egy fontos munkahelyi megbeszélésről."], "correctIndex": 2, "explanation": "Meg aggódva mondja: „Baj van, nem találom a vonatjegyet!”, amikor a Keleti pályaudvarra készülnének."}, {"question": "Mit talál Meg az asztal alatt, amikor lenéz a földre?", "options": ["Csak a cipőjét találja ott.", "Egy nagy kartondobozt és egy lámpát.", "A könyvét és a vonatjegyét.", "Egy poharat és a telefonját."], "correctIndex": 0, "explanation": "Meg az asztal alá néz: „Nem, az asztal alatt csak a cipőm van.” (No, under the table there is only my shoe.)"}, {"question": "Hol találják meg végül a vonatjegyet?", "options": ["A szék mellett a szőnyegen", "A nagy doboz mögött a szobában", "A kabát belső zsebében", "A könyv alatt az asztalon"], "correctIndex": 3, "explanation": "A jegy a könyv alatt rejtőzött: „Itt van! A könyv alatt volt az asztalon!” (It is here! It was under the book on the table!)"}]}}}}};
    let currentUnit = "a1-unit-01";
    let isDirty = false;

    window.onload = function() {
      populateSelector();
      loadUnit(currentUnit);

      // Keyboard shortcut Ctrl+S
      window.addEventListener("keydown", function(e) {
        if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "s") {
          e.preventDefault();
          saveAndPush();
        }
      });
    };

    function populateSelector() {
      const sel = document.getElementById("unitSelector");
      sel.innerHTML = "";
      Object.keys(STORIES).forEach(k => {
        const item = STORIES[k];
        const opt = document.createElement("option");
        opt.value = k;
        const uNum = k.replace("a1-unit-", "");
        opt.textContent = `Unit ${uNum}: ${item.title} (Lesson ${item.lesson})`;
        sel.appendChild(opt);
      });
      sel.value = currentUnit;
    }

    function switchUnit(unitKey) {
      if (isDirty) {
        if (!confirm("You have unsaved changes in this story. Switch anyway?")) {
          document.getElementById("unitSelector").value = currentUnit;
          return;
        }
      }
      currentUnit = unitKey;
      document.getElementById("unitSelector").value = currentUnit;
      loadUnit(unitKey);
    }

    function navigateUnit(delta) {
      const keys = Object.keys(STORIES);
      const idx = keys.indexOf(currentUnit);
      const nextIdx = idx + delta;
      if (nextIdx >= 0 && nextIdx < keys.length) {
        switchUnit(keys[nextIdx]);
      }
    }

    
    function serializeStoryToScript(d) {
      if (!d) return "";
      const lines = [];
      (d.paragraphs || []).forEach(p => {
        if (p.type === "narration") {
          lines.push(`[${p.text || ""}]\n`);
        } else {
          lines.push(`${p.speaker || "Narrator"}: ${p.text || ""}`);
        }
      });
      lines.push("\n=== QUESTIONS ===\n");
      const qs = d.narration?.pedagogical?.comprehensionQuestions || [];
      qs.forEach((q, i) => {
        lines.push(`${i + 1}. ${q.question || ""}`);
        (q.options || []).forEach((opt, idx) => {
          const mark = idx === q.correctIndex ? "[x]" : "[ ]";
          lines.push(`  ${mark} ${opt}`);
        });
        lines.push(`  > ${q.explanation || ""}\n`);
      });
      return lines.join("\n");
    }

    function loadUnit(unitKey) {
      currentUnit = unitKey;
      const item = STORIES[unitKey];
      
      // Check localStorage draft
      let draft = localStorage.getItem("hu_script_" + unitKey);
      let draftTitle = localStorage.getItem("hu_title_" + unitKey);

      // Check for legacy draft saved from the previous visual editor session
      if (!draft && localStorage.getItem("hu_draft_" + unitKey)) {
        try {
          const legacyObj = JSON.parse(localStorage.getItem("hu_draft_" + unitKey));
          draft = serializeStoryToScript(legacyObj);
          if (legacyObj.title) draftTitle = legacyObj.title;
          showStatus("Recovered your previous draft from browser storage!", "info");
        } catch(e) {
          console.warn("Could not parse legacy draft:", e);
        }
      }

      document.getElementById("titleInput").value = draftTitle !== null ? draftTitle : item.title;
      document.getElementById("scriptArea").value = draft !== null ? draft : item.script;
      
      const uNum = parseInt(unitKey.replace("a1-unit-", ""), 10);
      document.getElementById("lessonInfo").textContent = `Unit ${uNum} • Lesson ${item.lesson}`;
      
      isDirty = (draft !== null && draft !== item.script);
      updateCharCount();
    }

    function onScriptChange() {
      isDirty = true;
      const text = document.getElementById("scriptArea").value;
      localStorage.setItem("hu_script_" + currentUnit, text);
      updateCharCount();
    }

    function onTitleChange(val) {
      isDirty = true;
      localStorage.setItem("hu_title_" + currentUnit, val);
    }

    function updateCharCount() {
      const val = document.getElementById("scriptArea").value;
      const lines = val.split("\n").filter(l => l.trim()).length;
      document.getElementById("charCount").textContent = `${lines} lines • ${val.length} characters`;
    }

    async function saveAndPush() {
      const btn = document.getElementById("saveBtn");
      btn.disabled = true;
      btn.innerHTML = `<svg class="animate-spin w-4 h-4" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"></path></svg> Saving & Pushing...`;
      showStatus("Validating and pushing to GitHub...", "info");

      const scriptText = document.getElementById("scriptArea").value;
      const title = document.getElementById("titleInput").value.trim();

      try {
        const resp = await fetch("/api/save", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            unitKey: currentUnit,
            title: title,
            script: scriptText
          })
        });

        const res = await resp.json();
        if (res.ok) {
          isDirty = false;
          localStorage.removeItem("hu_script_" + currentUnit);
          localStorage.removeItem("hu_title_" + currentUnit);
          // Update in-memory copy
          STORIES[currentUnit].script = scriptText;
          STORIES[currentUnit].title = title;
          populateSelector();

          showStatus(res.message || `Saved & pushed ${currentUnit}!`, "success");
        } else {
          showStatus(res.error || res.message || "Failed to save.", "error");
        }
      } catch (err) {
        showStatus("Network or server error: " + err.message, "error");
      } finally {
        btn.disabled = false;
        btn.innerHTML = `<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7H5a2 2 0 00-2 2v9a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-3m-1 4l-3 3m0 0l-3-3m3 3V4"/></svg> Save & Push`;
      }
    }

    function showStatus(msg, type) {
      const banner = document.getElementById("statusBanner");
      banner.classList.remove("hidden", "bg-emerald-500/10", "text-emerald-400", "border-emerald-500/30", "bg-red-500/10", "text-red-400", "border-red-500/30", "bg-blue-500/10", "text-blue-400", "border-blue-500/30");

      if (type === "success") {
        banner.classList.add("bg-emerald-500/10", "text-emerald-400", "border-emerald-500/30");
      } else if (type === "error") {
        banner.classList.add("bg-red-500/10", "text-red-400", "border-red-500/30");
      } else {
        banner.classList.add("bg-blue-500/10", "text-blue-400", "border-blue-500/30");
      }
      document.getElementById("statusMsg").textContent = msg;
    }
  </script>
</body>
</html>
