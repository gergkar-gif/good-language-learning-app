<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hungarian A1 Stories — Script Editor</title>
  <script src="https://www.gstatic.com/antigravity/web/dev/tailwindcss.min.js"></script>
  <style>
    :root {
      --background: #0f172a;
      --card: #1e293b;
      --foreground: #f8fafc;
      --muted-foreground: #94a3b8;
      --border: #334155;
      --primary: #22c55e;
      --primary-foreground: #ffffff;
      --accent: #1e3a8a;
    }
  </style>
</head>
<body class="bg-[var(--background)] text-[var(--foreground)] min-h-screen p-4 antialiased flex flex-col">
  <div class="max-w-5xl w-full mx-auto flex-1 flex flex-col space-y-4">

    <!-- Top Action Header -->
    <header class="bg-[var(--card)] border border-[var(--border)] rounded-2xl p-4 shadow-sm flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">
      <div class="flex items-center gap-3">
        <span class="text-2xl">🇭🇺</span>
        <div class="flex items-center gap-2">
          <button onclick="navigateUnit(-1)" class="p-2 rounded-xl border border-[var(--border)] hover:bg-slate-700 text-xs font-bold transition">◀</button>
          <select id="unitSelector" onchange="switchUnit(this.value)" class="bg-[var(--background)] border border-[var(--border)] rounded-xl px-3 py-2 text-xs font-semibold focus:ring-2 focus:ring-blue-500 outline-none">
            <!-- Populated via JS -->
          </select>
          <button onclick="navigateUnit(1)" class="p-2 rounded-xl border border-[var(--border)] hover:bg-slate-700 text-xs font-bold transition">▶</button>
        </div>
      </div>

      <!-- Story Title & Save/Push Button -->
      <div class="flex items-center gap-3 flex-1 justify-end">
        <input type="text" id="titleInput" placeholder="Story Title..." oninput="onTitleChange(this.value)" class="bg-[var(--background)] border border-[var(--border)] rounded-xl px-3 py-2 text-xs font-semibold max-w-xs w-full focus:ring-2 focus:ring-blue-500 outline-none">
        
        <button id="saveBtn" onclick="saveAndPush()" class="px-5 py-2.5 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-xs flex items-center gap-2 shadow-sm transition active:scale-95">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7H5a2 2 0 00-2 2v9a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-3m-1 4l-3 3m0 0l-3-3m3 3V4"/></svg>
          Save & Push
        </button>
      </div>
    </header>

    <!-- Status Toast / Live Feedback -->
    <div id="statusBanner" class="hidden p-3 rounded-xl border text-xs font-medium flex items-center justify-between">
      <span id="statusMsg"></span>
      <button onclick="document.getElementById('statusBanner').classList.add('hidden')" class="font-bold ml-2">×</button>
    </div>

    <!-- Script Textarea (Full-height, Monospaced) -->
    <main class="flex-1 flex flex-col bg-[var(--card)] border border-[var(--border)] rounded-2xl p-4 shadow-sm space-y-3">
      <div class="flex items-center justify-between text-xs text-[var(--muted-foreground)] px-1">
        <span id="lessonInfo" class="font-medium text-emerald-400">Lesson 5 • Unit 1</span>
        <span class="text-[11px] font-mono">Tip: Ctrl+S saves & pushes • [Narration] • Speaker: Dialogue</span>
      </div>

      <textarea id="scriptArea" oninput="onScriptChange()" class="flex-1 w-full bg-[var(--background)] border border-[var(--border)] rounded-xl p-4 font-mono text-xs text-[var(--foreground)] leading-relaxed focus:ring-2 focus:ring-blue-500 outline-none resize-none" style="min-height: 520px;"></textarea>
      
      <div class="flex items-center justify-between text-[11px] text-[var(--muted-foreground)] pt-1 px-1">
        <span>Format: <code class="text-blue-400">[Narration]</code> for English notes, <code class="text-emerald-400">Speaker: text</code> for Hungarian lines, <code class="text-amber-400">=== QUESTIONS ===</code> with <code class="text-emerald-400">[x]</code> correct.</span>
        <span id="charCount"></span>
      </div>
    </main>

  </div>

ive"}], "pronunciations": []}, {"paraIndex": 19, "startTime": 50.54, "endTime": 52.13, "speaker": "Károly", "lang": "hu", "cues": [], "pronunciations": []}, {"paraIndex": 20, "startTime": 52.13, "endTime": 58.23, "speaker": "Meg", "lang": "hu", "cues": [{"type": "emphasis", "level": "strong"}, {"type": "pause", "durationMs": 250, "reason": "clause-boundary"}], "pronunciations": [{"word": "Szia", "ipa": "ˈsiɒ", "note": "Informal greeting ('hi/hello')"}]}, {"paraIndex": 21, "startTime": 58.23, "endTime": 59.85, "speaker": "Károly", "lang": "hu", "cues": [], "pronunciations": []}, {"paraIndex": 22, "startTime": 59.85, "endTime": 64.29, "speaker": "Narrator", "lang": "en", "cues": [], "pronunciations": []}], "pedagogical": {"keyVocabulary": [{"lemma": "könyv", "pos": "noun", "cefr": "A1", "gloss": "book"}, {"lemma": "telefon", "pos": "noun", "cefr": "A1", "gloss": "telephone"}, {"lemma": "ház", "pos": "noun", "cefr": "A1", "gloss": "house"}], "targetGrammar": [], "comprehensionQuestions": [{"question": "Hol van Meg és Károly?", "options": ["Budapesten", "Londonban", "Bécsben", "Madridban"], "correctIndex": 0, "explanation": "Meg Budapesten van Károllyal (Meg is in Budapest with Károly)."}, {"question": "Mi van az asztalon?", "options": ["Egy könyv és egy telefon", "Egy autó és egy kulcs", "Egy kutya és egy macska", "Csak egy pohár tej"], "correctIndex": 0, "explanation": "Károly rámutat egy könyvre és egy telefonra az asztalon (Ez egy könyv, az egy telefon)."}, {"question": "Milyen nyelven beszélnek a párbeszédekben?", "options": ["Magyarul", "Spanyolul", "Németül", "Olaszul"], "correctIndex": 0, "explanation": "Meg magyarul gyakorolja az alapvető szavakat Károllyal."}]}}}}, "a1-unit-02": {"id": "story.a1.unit02", "title": "Greetings with Károly", "lesson": 10, "level": "A1", "script": "[Meg meets Károly and his friends. They practise greetings and polite expressions.]\n\nKároly: Jó napot, Meg!\nMeg: Jó napot, Károly! Hogy vagy?\nKároly: Jól vagyok, köszönöm. És te?\nMeg: Jól vagyok, köszönöm.\n[Meg does not understand what Anna asks, so she asks her to repeat it more slowly.]\n\nAnna: Hogy vagy?\nMeg: Elnézést, nem értem. Megismételnéd? Lassabban, légyszi.\nAnna: Hogy... vagy?\nMeg: Ó, értem! Jól vagyok, köszönöm.\nAndrás: Tessék, egy kávé!\nMeg: Köszönöm! Rendben.\n[It's time to go. Meg says goodbye to everyone.]\n\nMariann: Viszlát, Meg!\nMeg: Viszlát, Károly! Viszlát, Anna! Viszlát, András! Viszlát, Mariann!\n\n=== QUESTIONS ===\n\n1. Miről beszélget Meg és a társaság?\n  [ ] Bevásárlásról és az árakról\n  [x] Köszönésekről és udvarias kifejezésekről\n  [ ] A budapesti időjárásról\n  [ ] Egy új munkahelyről\n  > Meg találkozik Károllyal és a barátaival, és köszönéseket gyakorolnak (Meg meets Károly and his friends and they practise greetings).\n\n2. Mit ad András Megnek?\n  [ ] Egy könyvet\n  [ ] Egy pohár vizet\n  [x] Egy kávét\n  [ ] Egy telefont\n  > András azt mondja: „Tessék, egy kávé!” (András offers Meg a coffee).\n\n3. Miért kéri Meg Annát, hogy beszéljen lassabban?\n  [x] Mert elsőre nem érti, amit Anna mond\n  [ ] Mert nem hallja a szobában lévő zaj miatt\n  [ ] Mert siet a buszhoz\n  [ ] Mert haragszik Annára\n  > Meg azt mondja: „Elnézést, nem értem. Megismételnéd? Lassabban, légyszi.” (Meg doesn't understand at first and asks Anna to speak slower).\n", "raw": {"id": "story.a1.unit02", "title": "Greetings with Károly", "level": "A1", "lesson": 10, "type": "original", "estimatedMinutes": 3, "characters": ["Meg", "Károly", "Anna", "András", "Mariann"], "paragraphs": [{"type": "narration", "lang": "en", "text": "Meg meets Károly and his friends. They practise greetings and polite expressions."}, {"type": "dialogue", "speaker": "Károly", "text": "Jó napot, Meg!"}, {"type": "dialogue", "speaker": "Meg", "text": "Jó napot, Károly! Hogy vagy?"}, {"type": "dialogue", "speaker": "Károly", "text": "Jól vagyok, köszönöm. És te?"}, {"type": "dialogue", "speaker": "Meg", "text": "Jól vagyok, köszönöm."}, {"type": "narration", "lang": "en", "text": "Meg does not understand what Anna asks, so she asks her to repeat it more slowly."}, {"type": "dialogue", "speaker": "Anna", "text": "Hogy vagy?"}, {"type": "dialogue", "speaker": "Meg", "text": "Elnézést, nem értem. Megismételnéd? Lassabban, légyszi."}, {"type": "dialogue", "speaker": "Anna", "text": "Hogy... vagy?"}, {"type": "dialogue", "speaker": "Meg", "text": "Ó, értem! Jól vagyok, köszönöm."}, {"type": "dialogue", "speaker": "András", "text": "Tessék, egy kávé!"}, {"type": "dialogue", "speaker": "Meg", "text": "Köszönöm! Rendben."}, {"type": "narration", "lang": "en", "text": "It's time to go. Meg says goodbye to everyone."}, {"type": "dialogue", "speaker": "Mariann", "text": "Viszlát, Meg!"}, {"type": "dialogue", "speaker": "Meg", "text": "Viszlát, Károly! Viszlát, Anna! Viszlát, András! Viszlát, Mariann!"}], "narration": {"pedagogical": {"comprehensionQuestions": [{"question": "Miről beszélget Meg és a társaság?", "options": ["Bevásárlásról és az árakról", "Köszönésekről és udvarias kifejezésekről", "A budapesti időjárásról", "Egy új munkahelyről"], "correctIndex": 1, "explanation": "Meg találkozik Károllyal és a barátaival, és köszönéseket gyakorolnak (Meg meets Károly and his friends and they practise greetings)."}, {"question": "Mit ad András Megnek?", "options": ["Egy könyvet", "Egy pohár vizet", "Egy kávét", "Egy telefont"], "correctIndex": 2, "explanation": "András azt mondja: „Tessék, egy kávé!” (András offers Meg a coffee)."}, {"question": "Miért kéri Meg Annát, hogy beszéljen lassabban?", "options": ["Mert elsőre nem érti, amit Anna mond", "Mert nem hallja a szobában lévő zaj miatt", "Mert siet a buszhoz", "Mert haragszik Annára"], "correctIndex": 0, "explanation": "Meg azt mondja: „Elnézést, nem értem. Megismételnéd? Lassabban, légyszi.” (Meg doesn't understand at first and asks Anna to speak slower)."}]}}}}, "a1-unit-03": {"id": "story.a1.unit03", "title": "Meg meets Anna and András", "lesson": 15, "level": "A1", "script": "[Károly introduces Meg to his sister Anna and his brother András. The group is still speaking mostly English, but Meg wants to try more Hungarian.]\n\nKároly: Meg, ő Anna.\nMeg: Szia, Anna!\nAnna: Szia! Ki vagy?\nMeg: Én Meg vagyok.\n[Anna smiles and asks Meg one more question.]\n\nAnna: Hol laksz?\nMeg: Én itt lakom.\nKároly: Igen. Meg itt lakik Budapesten.\nAndrás: Ki ő?\nKároly: Ő Meg. Ő a barátnőm.\nMeg: És te? Ki vagy?\nAndrás: Én András vagyok.\n[Meg understands most of the short exchange. She can now say her name and give a simple answer about where she lives.]\n\nMeg: Én Meg vagyok. Itt lakom.\nAnna: Mi a neved?\nMeg: A nevem Meg.\n[András smiles and says hello too.]\n\nAndrás: Szia, Meg!\nMeg: Szia, András!\n[Károly is glad his girlfriend is getting to know his family.]\n\nKároly: Meg a barátnőm és itt él.\n\n=== QUESTIONS ===\n\n1. Kivel találkozik Meg ebben a történetben?\n  [ ] Egy idegennel a metróállomáson\n  [ ] Egy pincérrel a kávézóban\n  [ ] Károly nagyszüleivel egy faluban\n  [x] Károly testvéreivel, Annával és Andrással\n  > Károly bemutatja Meget a testvéreinek, Annának és Andrásnak (Károly introduces Meg to his sister Anna and brother András).\n\n2. Hol lakik Meg Károly szerint?\n  [ ] Londonban\n  [x] Budapesten\n  [ ] Bécsben\n  [ ] Johannesburgban\n  > Károly elmondja: „Meg itt lakik Budapesten” (Meg lives here in Budapest).\n\n3. Kiként mutatja be Károly Meget Andrásnak?\n  [ ] A kollégájaként\n  [ ] A szomszédjaként\n  [x] A barátnőjeként\n  [ ] A magyar tanáraként\n  > Károly kijelenti: „Ő Meg. Ő a barátnőm” (She is Meg. She is my girlfriend).\n", "raw": {"id": "story.a1.unit03", "title": "Meg meets Anna and András", "level": "A1", "lesson": 15, "type": "original", "estimatedMinutes": 3, "characters": ["Károly", "Meg", "Anna", "András"], "paragraphs": [{"type": "narration", "text": "Károly introduces Meg to his sister Anna and his brother András. The group is still speaking mostly English, but Meg wants to try more Hungarian.", "lang": "en"}, {"type": "dialogue", "speaker": "Károly", "text": "Meg, ő Anna."}, {"type": "dialogue", "speaker": "Meg", "text": "Szia, Anna!"}, {"type": "dialogue", "speaker": "Anna", "text": "Szia! Ki vagy?"}, {"type": "dialogue", "speaker": "Meg", "text": "Én Meg vagyok."}, {"type": "narration", "text": "Anna smiles and asks Meg one more question.", "lang": "en"}, {"type": "dialogue", "speaker": "Anna", "text": "Hol laksz?"}, {"type": "dialogue", "speaker": "Meg", "text": "Én itt lakom."}, {"type": "dialogue", "speaker": "Károly", "text": "Igen. Meg itt lakik Budapesten."}, {"type": "dialogue", "speaker": "András", "text": "Ki ő?"}, {"type": "dialogue", "speaker": "Károly", "text": "Ő Meg. Ő a barátnőm."}, {"type": "dialogue", "speaker": "Meg", "text": "És te? Ki vagy?"}, {"type": "dialogue", "speaker": "András", "text": "Én András vagyok."}, {"type": "narration", "text": "Meg understands most of the short exchange. She can now say her name and give a simple answer about where she lives.", "lang": "en"}, {"type": "dialogue", "speaker": "Meg", "text": "Én Meg vagyok. Itt lakom."}, {"type": "dialogue", "speaker": "Anna", "text": "Mi a neved?"}, {"type": "dialogue", "speaker": "Meg", "text": "A nevem Meg."}, {"type": "narration", "text": "András smiles and says hello too.", "lang": "en"}, {"type": "dialogue", "speaker": "András", "text": "Szia, Meg!"}, {"type": "dialogue", "speaker": "Meg", "text": "Szia, András!"}, {"type": "narration", "text": "Károly is glad his girlfriend is getting to know his family.", "lang": "en"}, {"type": "dialogue", "speaker": "Károly", "text": "Meg a barátnőm és itt él."}], "narration": {"pedagogical": {"comprehensionQuestions": [{"question": "Kivel találkozik Meg ebben a történetben?", "options": ["Egy idegennel a metróállomáson", "Egy pincérrel a kávézóban", "Károly nagyszüleivel egy faluban", "Károly testvéreivel, Annával és Andrással"], "correctIndex": 3, "explanation": "Károly bemutatja Meget a testvéreinek, Annának és Andrásnak (Károly introduces Meg to his sister Anna and brother András)."}, {"question": "Hol lakik Meg Károly szerint?", "options": ["Londonban", "Budapesten", "Bécsben", "Johannesburgban"], "correctIndex": 1, "explanation": "Károly elmondja: „Meg itt lakik Budapesten” (Meg lives here in Budapest)."}, {"question": "Kiként mutatja be Károly Meget Andrásnak?", "options": ["A kollégájaként", "A szomszédjaként", "A barátnőjeként", "A magyar tanáraként"], "correctIndex": 2, "explanation": "Károly kijelenti: „Ő Meg. Ő a barátnőm” (She is Meg. She is my girlfriend)."}]}}}}, "a1-unit-04": {"id": "story.a1.unit04", "title": "Staying in Touch", "lesson": 20, "level": "A1", "script": "[Moving to a new country comes with a lot of bureaucracy — and often, you need to fill in many forms. Károly is practising with Meg some of the most important details that one can be asked when introducing themselves.]\n\nKároly: Hány éves vagy?\nMeg: Harminc éves vagyok.\n[Meg asks Károly the same question. They laugh because Károly is not sure he wants to talk about his age.]\n\nMeg: Hány éves vagy?\nKároly: Harminc éves vagyok.\n[Then they exchange contact details. Károly asks for Meg's address and phone number.]\n\nKároly: Hol laksz?\nMeg: Budapesten lakom. A címem Kossuth utca 10.\nKároly: Mi a telefonszámod?\nMeg: A telefonszámom nulla hat, harminc, egy kettő három, négy öt hat hét.\n[Károly didn't quite catch the last part, and asks Meg to slow down.]\n\nKároly: Lassabban, légyszi! Még egyszer?\nMeg: Nulla hat, harminc, egy kettő három, négy öt hat hét.\n[Meg turns the question around and asks for Károly's address too.]\n\nMeg: És a te címed? Mi a címed?\nKároly: Petőfi utca 5.\n[They also mention Meg's birthday. It is a small piece of information, but the conversation feels increasingly natural.]\n\nKároly: Mikor van a születésnapod?\nMeg: Áprilisban.\n\n=== QUESTIONS ===\n\n1. Milyen témákat gyakorol Károly és Meg a beszélgetésben?\n  [x] Személyes adatokat: életkort, címet és telefonszámot\n  [ ] Éttermi rendelést és fizetést\n  [ ] Vonatjegy vásárlását és utazási terveket\n  [ ] Időjárást és évszakokat\n  > Károly és Meg a legfontosabb bemutatkozási adatokat, életkort, címet és telefonszámot gyakorolják (They practise essential personal details: age, address, and phone number).\n\n2. Hány éves Károly?\n  [ ] Harminckét éves\n  [ ] Huszonöt éves\n  [x] Harminc éves\n  [ ] Harmincöt éves\n  > Károly mondja: „Harminc éves vagyok” (I am 30 years old; Meg is 32).\n\n3. Mikor van Meg születésnapja?\n  [ ] Januárban\n  [ ] Nyáron\n  [ ] Decemberben\n  [x] Áprilisban\n  > Károly kérdésére („Mikor van a születésnapod?”) Meg azt feleli: „Áprilisban” (In April).\n", "raw": {"id": "story.a1.unit04", "title": "Staying in Touch", "level": "A1", "lesson": 20, "type": "original", "estimatedMinutes": 3, "characters": ["Károly", "Meg"], "paragraphs": [{"type": "narration", "text": "Moving to a new country comes with a lot of bureaucracy — and often, you need to fill in many forms. Károly is practising with Meg some of the most important details that one can be asked when introducing themselves.", "lang": "en"}, {"type": "dialogue", "speaker": "Károly", "text": "Hány éves vagy?"}, {"type": "dialogue", "speaker": "Meg", "text": "Harminc éves vagyok."}, {"type": "narration", "text": "Meg asks Károly the same question. They laugh because Károly is not sure he wants to talk about his age.", "lang": "en"}, {"type": "dialogue", "speaker": "Meg", "text": "Hány éves vagy?"}, {"type": "dialogue", "speaker": "Károly", "text": "Harminc éves vagyok."}, {"type": "narration", "text": "Then they exchange contact details. Károly asks for Meg's address and phone number.", "lang": "en"}, {"type": "dialogue", "speaker": "Károly", "text": "Hol laksz?"}, {"type": "dialogue", "speaker": "Meg", "text": "Budapesten lakom. A címem Kossuth utca 10."}, {"type": "dialogue", "speaker": "Károly", "text": "Mi a telefonszámod?"}, {"type": "dialogue", "speaker": "Meg", "text": "A telefonszámom nulla hat, harminc, egy kettő három, négy öt hat hét."}, {"type": "narration", "text": "Károly didn't quite catch the last part, and asks Meg to slow down.", "lang": "en"}, {"type": "dialogue", "speaker": "Károly", "text": "Lassabban, légyszi! Még egyszer?"}, {"type": "dialogue", "speaker": "Meg", "text": "Nulla hat, harminc, egy kettő három, négy öt hat hét."}, {"type": "narration", "text": "Meg turns the question around and asks for Károly's address too.", "lang": "en"}, {"type": "dialogue", "speaker": "Meg", "text": "És a te címed? Mi a címed?"}, {"type": "dialogue", "speaker": "Károly", "text": "Petőfi utca 5."}, {"type": "narration", "text": "They also mention Meg's birthday. It is a small piece of information, but the conversation feels increasingly natural.", "lang": "en"}, {"type": "dialogue", "speaker": "Károly", "text": "Mikor van a születésnapod?"}, {"type": "dialogue", "speaker": "Meg", "text": "Áprilisban."}], "narration": {"pedagogical": {"comprehensionQuestions": [{"question": "Milyen témákat gyakorol Károly és Meg a beszélgetésben?", "options": ["Személyes adatokat: életkort, címet és telefonszámot", "Éttermi rendelést és fizetést", "Vonatjegy vásárlását és utazási terveket", "Időjárást és évszakokat"], "correctIndex": 0, "explanation": "Károly és Meg a legfontosabb bemutatkozási adatokat, életkort, címet és telefonszámot gyakorolják (They practise essential personal details: age, address, and phone number)."}, {"question": "Hány éves Károly?", "options": ["Harminckét éves", "Huszonöt éves", "Harminc éves", "Harmincöt éves"], "correctIndex": 2, "explanation": "Károly mondja: „Harminc éves vagyok” (I am 30 years old; Meg is 32)."}, {"question": "Mikor van Meg születésnapja?", "options": ["Januárban", "Nyáron", "Decemberben", "Áprilisban"], "correctIndex": 3, "explanation": "Károly kérdésére („Mikor van a születésnapod?”) Meg azt feleli: „Áprilisban” (In April)."}]}}}}, "a1-unit-05": {"id": "story.a1.unit05", "title": "What Is This?", "lesson": null, "level": "A1", "script": "[Meg is in Károly's apartment. They look around the room together.]\n\nKároly: Ez a szoba.\nMeg: Mi ez?\nKároly: Ez egy asztal. Az ott egy szék.\n[Meg sees a book, a phone, and a lamp. The door and window are open.]\n\nMeg: Mi ez?\nKároly: Ez egy könyv. A telefon ott van az asztalon.\nMeg: És a lámpa?\nKároly: Itt van.\n[They walk to the kitchen. There is a key by the door.]\n\nMeg: Hol van a kulcs?\nKároly: Ott van.\n[Meg asks about another object.]\n\nMeg: Van itt egy szék?\nKároly: Nincs. Van egy asztal.\n[Meg can now ask what something is and where it is.]\n\nKároly: Ez a tárgy egy telefon.\nMeg: Micsoda ez?\nKároly: Ez? Ez egy telefon!\n[Meg laughs — she can now ask what something is, plainly or with a little surprise, all on her own.]\n\n\n=== QUESTIONS ===\n\n1. Mit csinál Meg és Károly a szobában és a lakásban?\n  [ ] Ebédhez terítenek az asztalon\n  [ ] Bútorokat pakolnak a költözéshez\n  [x] Körülnéznek, és tárgyakat azonosítanak magyarul\n  [ ] Tévét néznek a nappaliban\n  > Meg és Károly körülnéznek a szobában, és tárgyak nevét és helyét gyakorolják (They look around the room identifying everyday objects and their locations in Hungarian).\n\n2. Hol van a telefon Károly szerint?\n  [x] Az asztalon\n  [ ] A szék alatt\n  [ ] Az ágyban\n  [ ] A táskában\n  > Károly mondja: „A telefon ott van az asztalon” (The phone is there on the table).\n\n3. Van szék a konyhában, amikor Meg megkérdezi?\n  [ ] Igen, kettő nagy szék van\n  [x] Nincs, csak asztal van\n  [ ] Igen, az ajtó mellett\n  [ ] Nincs sem szék, sem asztal\n  > Meg kérdésére („Van itt egy szék?”) Károly válasza: „Nincs. Van egy asztal” (No. There is a table).\n", "raw": {"id": "story.a1.unit05", "title": "What Is This?", "level": "A1", "type": "original", "characters": ["Károly", "Meg"], "paragraphs": [{"type": "narration", "lang": "en", "text": "Meg is in Károly's apartment. They look around the room together."}, {"type": "dialogue", "speaker": "Károly", "text": "Ez a szoba."}, {"type": "dialogue", "speaker": "Meg", "text": "Mi ez?"}, {"type": "dialogue", "speaker": "Károly", "text": "Ez egy asztal. Az ott egy szék."}, {"type": "narration", "lang": "en", "text": "Meg sees a book, a phone, and a lamp. The door and window are open."}, {"type": "dialogue", "speaker": "Meg", "text": "Mi ez?"}, {"type": "dialogue", "speaker": "Károly", "text": "Ez egy könyv. A telefon ott van az asztalon."}, {"type": "dialogue", "speaker": "Meg", "text": "És a lámpa?"}, {"type": "dialogue", "speaker": "Károly", "text": "Itt van."}, {"type": "narration", "lang": "en", "text": "They walk to the kitchen. There is a key by the door."}, {"type": "dialogue", "speaker": "Meg", "text": "Hol van a kulcs?"}, {"type": "dialogue", "speaker": "Károly", "text": "Ott van."}, {"type": "narration", "lang": "en", "text": "Meg asks about another object."}, {"type": "dialogue", "speaker": "Meg", "text": "Van itt egy szék?"}, {"type": "dialogue", "speaker": "Károly", "text": "Nincs. Van egy asztal."}, {"type": "narration", "lang": "en", "text": "Meg can now ask what something is and where it is."}, {"type": "dialogue", "speaker": "Károly", "text": "Ez a tárgy egy telefon."}, {"type": "dialogue", "speaker": "Meg", "text": "Micsoda ez?"}, {"type": "dialogue", "speaker": "Károly", "text": "Ez? Ez egy telefon!"}, {"type": "narration", "lang": "en", "text": "Meg laughs — she can now ask what something is, plainly or with a little surprise, all on her own."}], "narration": {"pedagogical": {"comprehensionQuestions": [{"question": "Mit csinál Meg és Károly a szobában és a lakásban?", "options": ["Ebédhez terítenek az asztalon", "Bútorokat pakolnak a költözéshez", "Körülnéznek, és tárgyakat azonosítanak magyarul", "Tévét néznek a nappaliban"], "correctIndex": 2, "explanation": "Meg és Károly körülnéznek a szobában, és tárgyak nevét és helyét gyakorolják (They look around the room identifying everyday objects and their locations in Hungarian)."}, {"question": "Hol van a telefon Károly szerint?", "options": ["Az asztalon", "A szék alatt", "Az ágyban", "A táskában"], "correctIndex": 0, "explanation": "Károly mondja: „A telefon ott van az asztalon” (The phone is there on the table)."}, {"question": "Van szék a konyhában, amikor Meg megkérdezi?", "options": ["Igen, kettő nagy szék van", "Nincs, csak asztal van", "Igen, az ajtó mellett", "Nincs sem szék, sem asztal"], "correctIndex": 1, "explanation": "Meg kérdésére („Van itt egy szék?”) Károly válasza: „Nincs. Van egy asztal” (No. There is a table)."}]}}}}, "a1-unit-06": {"id": "story.a1.unit06", "title": "Family", "lesson": null, "level": "A1", "script": "[Károly shows Meg a family photo. He introduces everyone in it, one by one.]\n\nKároly: Ez a családom.\nMeg: Ki az?\nKároly: Az az anyám.\nMeg: És az?\nKároly: Az az apám.\n[Meg asks if Károly has any siblings.]\n\nMeg: Van testvéred?\nKároly: Igen. Van egy nővérem és egy öcsém.\n[He points to two more people in the photo.]\n\nMeg: Ki az?\nKároly: Az a nővérem, az az öcsém.\n[The photo also has Károly's grandparents.]\n\nMeg: Ki az?\nKároly: Az a nagymamám, az a nagypapám.\n[Károly asks if Meg has siblings too.]\n\nKároly: Van testvéred?\nMeg: Igen. Van két húgom.\n[Her two younger sisters, Kaylee and Lauren, are twins — they still live in Johannesburg.]\n\n[Meg counts all the family members in the photo.]\n\nMeg: Sok családtag van a képen.\nKároly: Igen. A családtagok együtt vannak.\n[Meg is happy — she already understands most of Károly's family.]\n\n\n=== QUESTIONS ===\n\n1. Miről beszélget Károly és Meg a történetben?\n  [ ] Egy budapesti kirándulásról\n  [x] Károly családjáról egy fénykép alapján\n  [ ] Meg új munkahelyéről\n  [ ] A városi közlekedésről\n  > Károly megmutatja a családját egy fényképen, és sorra bemutatja őket Megnek (Károly shows Meg his family in a photo and introduces them one by one).\n\n2. Hány húga van Megnek?\n  [ ] Egy nővére van\n  [ ] Három húga van\n  [ ] Nincs testvére\n  [x] Két húga van\n  > Meg mondja: „Igen. Van két húgom” (Yes. I have two younger sisters).\n\n3. Kik szerepelnek Károly családtagjai között a képen?\n  [x] A szülei, a nővére, az öccse és a nagyszülei\n  [ ] Csak a barátai és a kollégái\n  [ ] Csak az unokatestvérei\n  [ ] Csak a nagymamája és a nagypapája\n  > Károly bemutatja az anyját, apját, nővérét, öccsét, nagymamáját és nagypapáját (Károly introduces his mother, father, older sister, younger brother, and grandparents).\n", "raw": {"id": "story.a1.unit06", "title": "Family", "level": "A1", "type": "original", "characters": ["Károly", "Meg"], "paragraphs": [{"type": "narration", "lang": "en", "text": "Károly shows Meg a family photo. He introduces everyone in it, one by one."}, {"type": "dialogue", "speaker": "Károly", "text": "Ez a családom."}, {"type": "dialogue", "speaker": "Meg", "text": "Ki az?"}, {"type": "dialogue", "speaker": "Károly", "text": "Az az anyám."}, {"type": "dialogue", "speaker": "Meg", "text": "És az?"}, {"type": "dialogue", "speaker": "Károly", "text": "Az az apám."}, {"type": "narration", "lang": "en", "text": "Meg asks if Károly has any siblings."}, {"type": "dialogue", "speaker": "Meg", "text": "Van testvéred?"}, {"type": "dialogue", "speaker": "Károly", "text": "Igen. Van egy nővérem és egy öcsém."}, {"type": "narration", "lang": "en", "text": "He points to two more people in the photo."}, {"type": "dialogue", "speaker": "Meg", "text": "Ki az?"}, {"type": "dialogue", "speaker": "Károly", "text": "Az a nővérem, az az öcsém."}, {"type": "narration", "lang": "en", "text": "The photo also has Károly's grandparents."}, {"type": "dialogue", "speaker": "Meg", "text": "Ki az?"}, {"type": "dialogue", "speaker": "Károly", "text": "Az a nagymamám, az a nagypapám."}, {"type": "narration", "lang": "en", "text": "Károly asks if Meg has siblings too."}, {"type": "dialogue", "speaker": "Károly", "text": "Van testvéred?"}, {"type": "dialogue", "speaker": "Meg", "text": "Igen. Van két húgom."}, {"type": "narration", "lang": "en", "text": "Her two younger sisters, Kaylee and Lauren, are twins — they still live in Johannesburg."}, {"type": "narration", "lang": "en", "text": "Meg counts all the family members in the photo."}, {"type": "dialogue", "speaker": "Meg", "text": "Sok családtag van a képen."}, {"type": "dialogue", "speaker": "Károly", "text": "Igen. A családtagok együtt vannak."}, {"type": "narration", "lang": "en", "text": "Meg is happy — she already understands most of Károly's family."}], "narration": {"pedagogical": {"comprehensionQuestions": [{"question": "Miről beszélget Károly és Meg a történetben?", "options": ["Egy budapesti kirándulásról", "Károly családjáról egy fénykép alapján", "Meg új munkahelyéről", "A városi közlekedésről"], "correctIndex": 1, "explanation": "Károly megmutatja a családját egy fényképen, és sorra bemutatja őket Megnek (Károly shows Meg his family in a photo and introduces them one by one)."}, {"question": "Hány húga van Megnek?", "options": ["Egy nővére van", "Három húga van", "Nincs testvére", "Két húga van"], "correctIndex": 3, "explanation": "Meg mondja: „Igen. Van két húgom” (Yes. I have two younger sisters)."}, {"question": "Kik szerepelnek Károly családtagjai között a képen?", "options": ["A szülei, a nővére, az öccse és a nagyszülei", "Csak a barátai és a kollégái", "Csak az unokatestvérei", "Csak a nagymamája és a nagypapája"], "correctIndex": 0, "explanation": "Károly bemutatja az anyját, apját, nővérét, öccsét, nagymamáját és nagypapáját (Károly introduces his mother, father, older sister, younger brother, and grandparents)."}]}}}}, "a1-unit-07": {"id": "story.a1.unit07", "title": "Describing People", "lesson": null, "level": "A1", "script": "[Meg meets several people in Budapest. She asks Károly what each one is like.]\n\nMeg: Milyen ő?\nKároly: Ő egy magas férfi. Barna haja van. Kedves és vicces.\n[The man is Károly's friend.]\n\nMeg: Ő a barátod?\nKároly: Igen, ő a barátom.\n[A young woman arrives. She is short, blonde, and quiet.]\n\nMeg: Milyen a nő?\nKároly: Fiatal, szőke és csendes.\n[Another woman is an acquaintance and very kind.]\n\nKároly: Ő egy ismerős. Nagyon kedves.\n[Meg notices a small person near the door. The person is strong.]\n\nMeg: Ő milyen?\nKároly: Kicsi, de erős.\n[Meg now understands that a person can be a man or a woman.]\n\nMeg: Sok kedves ember van itt.\n[They continue talking about friends and acquaintances.]\n\nMeg: Milyen a férfi és a nő?\nKároly: A férfi magas, a nő alacsony.\nMeg: A barna haj szép.\n\n=== QUESTIONS ===\n\n1. Mit tanul meg és gyakorol Meg ebben a szövegben?\n  [x] Emberek külső és belső tulajdonságainak leírását\n  [ ] Vásárlási kifejezéseket egy szupermarketben\n  [ ] Éttermi ételek rendelését\n  [ ] Útbaigazítást a vasútállomásra\n  > Meg és Károly embereket jellemeznek (magas, alacsony, kedves, szőke, csendes) (They practise describing people's appearance and personality traits).\n\n2. Milyen a fiatal nő Károly szerint?\n  [ ] Magas és hangos\n  [ ] Idős és fáradt\n  [x] Fiatal, szőke és csendes\n  [ ] Erős és vicces\n  > Károly elmondja róla: „Fiatal, szőke és csendes” (Young, blonde, and quiet).\n\n3. Hogyan vélekedik Meg a barna hajról a beszélgetés végén?\n  [ ] Azt gondolja, hogy ritka\n  [ ] Nem tetszik neki\n  [ ] Nem mond semmit a hajról\n  [x] Azt mondja, hogy a barna haj szép\n  > Meg a szöveg végén megjegyzi: „A barna haj szép” (Brown hair is beautiful).\n", "raw": {"id": "story.a1.unit07", "title": "Describing People", "level": "A1", "type": "original", "characters": ["Meg", "Károly"], "paragraphs": [{"type": "narration", "lang": "en", "text": "Meg meets several people in Budapest. She asks Károly what each one is like."}, {"type": "dialogue", "speaker": "Meg", "text": "Milyen ő?"}, {"type": "dialogue", "speaker": "Károly", "text": "Ő egy magas férfi. Barna haja van. Kedves és vicces."}, {"type": "narration", "lang": "en", "text": "The man is Károly's friend."}, {"type": "dialogue", "speaker": "Meg", "text": "Ő a barátod?"}, {"type": "dialogue", "speaker": "Károly", "text": "Igen, ő a barátom."}, {"type": "narration", "lang": "en", "text": "A young woman arrives. She is short, blonde, and quiet."}, {"type": "dialogue", "speaker": "Meg", "text": "Milyen a nő?"}, {"type": "dialogue", "speaker": "Károly", "text": "Fiatal, szőke és csendes."}, {"type": "narration", "lang": "en", "text": "Another woman is an acquaintance and very kind."}, {"type": "dialogue", "speaker": "Károly", "text": "Ő egy ismerős. Nagyon kedves."}, {"type": "narration", "lang": "en", "text": "Meg notices a small person near the door. The person is strong."}, {"type": "dialogue", "speaker": "Meg", "text": "Ő milyen?"}, {"type": "dialogue", "speaker": "Károly", "text": "Kicsi, de erős."}, {"type": "narration", "lang": "en", "text": "Meg now understands that a person can be a man or a woman."}, {"type": "dialogue", "speaker": "Meg", "text": "Sok kedves ember van itt."}, {"type": "narration", "lang": "en", "text": "They continue talking about friends and acquaintances."}, {"type": "dialogue", "speaker": "Meg", "text": "Milyen a férfi és a nő?"}, {"type": "dialogue", "speaker": "Károly", "text": "A férfi magas, a nő alacsony."}, {"type": "dialogue", "speaker": "Meg", "text": "A barna haj szép."}], "narration": {"pedagogical": {"comprehensionQuestions": [{"question": "Mit tanul meg és gyakorol Meg ebben a szövegben?", "options": ["Emberek külső és belső tulajdonságainak leírását", "Vásárlási kifejezéseket egy szupermarketben", "Éttermi ételek rendelését", "Útbaigazítást a vasútállomásra"], "correctIndex": 0, "explanation": "Meg és Károly embereket jellemeznek (magas, alacsony, kedves, szőke, csendes) (They practise describing people's appearance and personality traits)."}, {"question": "Milyen a fiatal nő Károly szerint?", "options": ["Magas és hangos", "Idős és fáradt", "Fiatal, szőke és csendes", "Erős és vicces"], "correctIndex": 2, "explanation": "Károly elmondja róla: „Fiatal, szőke és csendes” (Young, blonde, and quiet)."}, {"question": "Hogyan vélekedik Meg a barna hajról a beszélgetés végén?", "options": ["Azt gondolja, hogy ritka", "Nem tetszik neki", "Nem mond semmit a hajról", "Azt mondja, hogy a barna haj szép"], "correctIndex": 3, "explanation": "Meg a szöveg végén megjegyzi: „A barna haj szép” (Brown hair is beautiful)."}]}}}}, "a1-unit-08": {"id": "story.a1.unit08", "title": "A Group Gathering", "lesson": null, "level": "A1", "script": "[Károly and Meg are at a gathering with friends and family. The room is full.]\n\nKároly: Sok ember van itt.\nMeg: Igen. Egy nagy csoport.\n[They look at the things in the room.]\n\nMeg: A könyvek itt vannak. Az asztalok is itt vannak.\nKároly: A székek ott vannak. Az ajtók kicsik.\nMeg: Az ablakok nagyok.\n[The friends and the children have arrived.]\n\nMeg: A barátok és a gyerekek együtt vannak.\nKároly: Igen, az emberek mind együtt vannak.\nMeg: Hány gyerek van itt?\nKároly: Hat gyerek van itt.\n[Some things are big, some are small, some are new and some are old.]\n\nMeg: A nagy asztalok és a kicsi székek.\nKároly: Az új könyvek és a régi könyvek.\n[Meg counts the chairs.]\n\nMeg: Néhány szék van itt. Több szék kell.\nKároly: Igen, több szék kell. A család is itt van.\nMeg: Sok barát van itt. Szép csoport!\n\n=== QUESTIONS ===\n\n1. Where are Károly and Meg?\n  [x] At a gathering of friends and family\n  [ ] In a shop full of books\n  [ ] At a school with many children\n  > The narration says Károly and Meg are at a gathering with friends and family, and Károly says Sok ember van itt (There are many people here).\n\n2. What does Meg say is needed?\n  [ ] More tables\n  [x] More chairs\n  [ ] More windows\n  > Meg says Néhány szék van itt. Több szék kell. (A few chairs are here. More chairs are needed.)\n\n3. Who is together, according to Meg?\n  [x] The friends and the children\n  [ ] The books and the tables\n  [ ] The doors and the windows\n  > Meg says A barátok és a gyerekek együtt vannak. (The friends and the children are together.)\n", "raw": {"id": "story.a1.unit08", "title": "A Group Gathering", "level": "A1", "type": "original", "characters": ["Károly", "Meg"], "paragraphs": [{"type": "narration", "lang": "en", "text": "Károly and Meg are at a gathering with friends and family. The room is full."}, {"type": "dialogue", "speaker": "Károly", "text": "Sok ember van itt."}, {"type": "dialogue", "speaker": "Meg", "text": "Igen. Egy nagy csoport."}, {"type": "narration", "lang": "en", "text": "They look at the things in the room."}, {"type": "dialogue", "speaker": "Meg", "text": "A könyvek itt vannak. Az asztalok is itt vannak."}, {"type": "dialogue", "speaker": "Károly", "text": "A székek ott vannak. Az ajtók kicsik."}, {"type": "dialogue", "speaker": "Meg", "text": "Az ablakok nagyok."}, {"type": "narration", "lang": "en", "text": "The friends and the children have arrived."}, {"type": "dialogue", "speaker": "Meg", "text": "A barátok és a gyerekek együtt vannak."}, {"type": "dialogue", "speaker": "Károly", "text": "Igen, az emberek mind együtt vannak."}, {"type": "dialogue", "speaker": "Meg", "text": "Hány gyerek van itt?"}, {"type": "dialogue", "speaker": "Károly", "text": "Hat gyerek van itt."}, {"type": "narration", "lang": "en", "text": "Some things are big, some are small, some are new and some are old."}, {"type": "dialogue", "speaker": "Meg", "text": "A nagy asztalok és a kicsi székek."}, {"type": "dialogue", "speaker": "Károly", "text": "Az új könyvek és a régi könyvek."}, {"type": "narration", "lang": "en", "text": "Meg counts the chairs."}, {"type": "dialogue", "speaker": "Meg", "text": "Néhány szék van itt. Több szék kell."}, {"type": "dialogue", "speaker": "Károly", "text": "Igen, több szék kell. A család is itt van."}, {"type": "dialogue", "speaker": "Meg", "text": "Sok barát van itt. Szép csoport!"}], "narration": {"pedagogical": {"comprehensionQuestions": [{"question": "Where are Károly and Meg?", "options": ["At a gathering of friends and family", "In a shop full of books", "At a school with many children"], "correctIndex": 0, "explanation": "The narration says Károly and Meg are at a gathering with friends and family, and Károly says Sok ember van itt (There are many people here)."}, {"question": "What does Meg say is needed?", "options": ["More tables", "More chairs", "More windows"], "correctIndex": 1, "explanation": "Meg says Néhány szék van itt. Több szék kell. (A few chairs are here. More chairs are needed.)"}, {"question": "Who is together, according to Meg?", "options": ["The friends and the children", "The books and the tables", "The doors and the windows"], "correctIndex": 0, "explanation": "Meg says A barátok és a gyerekek együtt vannak. (The friends and the children are together.)"}]}}}}, "a1-unit-09": {"id": "story.a1.unit09", "title": "Whose Is It?", "lesson": null, "level": "A1", "script": "[Meg and Károly are about to leave the flat. They check their things.]\n\nMeg: Hol van a telefonod?\nKároly: A telefonom itt van. És a kulcsod?\nMeg: A kulcsom ott van. A táska az enyém.\nKároly: Igen, a táska a tiéd. A könyv az enyém.\nMeg: A könyved régi, a táskám új.\n[Their friend Anna has already left, but her things are still in the flat.]\n\nMeg: Anna nincs itt. Itt van a kulcsa?\nKároly: Igen, a kulcsa itt van. A telefonja ott van.\nMeg: A telefon fontos dolog.\nKároly: Igen, nagyon fontos.\n[Now they look at the flat and the car.]\n\nMeg: A lakás a miénk. Van saját szobád?\nKároly: Igen, van saját szobám. A szobám nagy.\nMeg: A szobám kicsi. Kié az autó?\nKároly: Az autó a miénk. A kulcsa itt van.\nMeg: Rendben!\n\n=== QUESTIONS ===\n\n1. Kié a táska?\n  [x] Meg\n  [ ] Károly\n  [ ] Anna\n  > Meg says: \"A táska az enyém\" (The bag is mine). Károly agrees: \"a táska a tiéd\".\n\n2. Anna nincs itt. Hol van a kulcsa?\n  [x] Itt van.\n  [ ] Ott van.\n  [ ] Nincs itt.\n  > Károly says: \"A kulcsa itt van\" (Her key is here). It is her phone that is there.\n\n3. Kié az autó?\n  [x] A miénk.\n  [ ] Az övé.\n  [ ] Az enyém.\n  > Károly says: \"Az autó a miénk\" (The car is ours).\n", "raw": {"id": "story.a1.unit09", "title": "Whose Is It?", "level": "A1", "type": "original", "characters": ["Meg", "Károly"], "paragraphs": [{"type": "narration", "lang": "en", "text": "Meg and Károly are about to leave the flat. They check their things."}, {"type": "dialogue", "speaker": "Meg", "text": "Hol van a telefonod?"}, {"type": "dialogue", "speaker": "Károly", "text": "A telefonom itt van. És a kulcsod?"}, {"type": "dialogue", "speaker": "Meg", "text": "A kulcsom ott van. A táska az enyém."}, {"type": "dialogue", "speaker": "Károly", "text": "Igen, a táska a tiéd. A könyv az enyém."}, {"type": "dialogue", "speaker": "Meg", "text": "A könyved régi, a táskám új."}, {"type": "narration", "lang": "en", "text": "Their friend Anna has already left, but her things are still in the flat."}, {"type": "dialogue", "speaker": "Meg", "text": "Anna nincs itt. Itt van a kulcsa?"}, {"type": "dialogue", "speaker": "Károly", "text": "Igen, a kulcsa itt van. A telefonja ott van."}, {"type": "dialogue", "speaker": "Meg", "text": "A telefon fontos dolog."}, {"type": "dialogue", "speaker": "Károly", "text": "Igen, nagyon fontos."}, {"type": "narration", "lang": "en", "text": "Now they look at the flat and the car."}, {"type": "dialogue", "speaker": "Meg", "text": "A lakás a miénk. Van saját szobád?"}, {"type": "dialogue", "speaker": "Károly", "text": "Igen, van saját szobám. A szobám nagy."}, {"type": "dialogue", "speaker": "Meg", "text": "A szobám kicsi. Kié az autó?"}, {"type": "dialogue", "speaker": "Károly", "text": "Az autó a miénk. A kulcsa itt van."}, {"type": "dialogue", "speaker": "Meg", "text": "Rendben!"}], "narration": {"pedagogical": {"comprehensionQuestions": [{"question": "Kié a táska?", "options": ["Meg", "Károly", "Anna"], "correctIndex": 0, "explanation": "Meg says: \"A táska az enyém\" (The bag is mine). Károly agrees: \"a táska a tiéd\"."}, {"question": "Anna nincs itt. Hol van a kulcsa?", "options": ["Itt van.", "Ott van.", "Nincs itt."], "correctIndex": 0, "explanation": "Károly says: \"A kulcsa itt van\" (Her key is here). It is her phone that is there."}, {"question": "Kié az autó?", "options": ["A miénk.", "Az övé.", "Az enyém."], "correctIndex": 0, "explanation": "Károly says: \"Az autó a miénk\" (The car is ours)."}]}}}}, "a1-unit-10": {"id": "story.a1.unit10", "title": "Foundations", "lesson": null, "level": "A1", "script": "[The first foundation arc comes together at a small gathering with Károly, Meg, Anna, András and Mariann.]\n\nKároly: Szia, Meg!\nMeg: Szia! Köszönöm.\n[Meg reviews simple questions with Károly, who now lives with her.]\n\nMeg: Hol laksz?\nKároly: Budapesten lakom. Veled élek.\nMeg: Igen, együtt élünk.\n[Anna and András join them. Meg can identify people, objects and family members.]\n\nKároly: Ő Anna. Ő András.\nMeg: Ők a család.\nAnna: Mi ez?\nMeg: Ez egy könyv.\n[There are several books and chairs. Meg can now recognise plurals.]\n\nAndrás: A könyvek és a székek itt vannak.\nMeg: A barátok is itt vannak.\n[Meg also understands simple possession.]\n\nKároly: Ez a táskád?\nMeg: Igen, a táska az enyém.\nMariann: Ez a könyved?\nMeg: Nem, a könyvem itt van.\n[The group continues speaking Hungarian. Meg no longer needs every short exchange translated.]\n\nMeg: Igen. Értem.\n\n=== QUESTIONS ===\n\n1. Kikkel találkozik Meg ebben az összefoglaló leckében?\n  [ ] Idegen turistákkal a városban\n  [x] Károllyal, Annával, Andrással és Mariann-nal\n  [ ] A dél-afrikai testvéreivel\n  [ ] Csak a budapesti főbérlőjével\n  > Meg találkozik Károllyal és a baráti/családi körrel (Anna, András, Mariann) (Meg meets Károly, Anna, András, and Mariann).\n\n2. Mit árul el Károly a lakóhelyéről?\n  [ ] Egyedül lakik egy kollégiumban\n  [ ] Vidéken lakik a szüleinél\n  [x] Budapesten lakik, és együtt él Meggel\n  [ ] Külföldre költözik a jövő héten\n  > Károly mondja: „Budapesten lakom. Veled élek”, Meg pedig megerősíti: „Igen, együtt élünk” (I live in Budapest. I live with you).\n\n3. Hogyan halad Meg a magyar nyelv tanulásával a szöveg szerint?\n  [ ] Még semmit nem ért meg\n  [ ] Már nem akar magyarul beszélni\n  [ ] Csak angolul válaszol mindenkinek\n  [x] Már sok mindent megért, és nem kell mindent lefordítani neki\n  > A szöveg szerint Meg már nem igényel minden mondathoz fordítást: „Igen. Értem” (Meg understands most of it and no longer needs everything translated).\n", "raw": {"id": "story.a1.unit10", "title": "Foundations", "level": "A1", "type": "original", "characters": ["Károly", "Meg", "Anna", "András", "Mariann"], "paragraphs": [{"type": "narration", "lang": "en", "text": "The first foundation arc comes together at a small gathering with Károly, Meg, Anna, András and Mariann."}, {"type": "dialogue", "speaker": "Károly", "text": "Szia, Meg!"}, {"type": "dialogue", "speaker": "Meg", "text": "Szia! Köszönöm."}, {"type": "narration", "lang": "en", "text": "Meg reviews simple questions with Károly, who now lives with her."}, {"type": "dialogue", "speaker": "Meg", "text": "Hol laksz?"}, {"type": "dialogue", "speaker": "Károly", "text": "Budapesten lakom. Veled élek."}, {"type": "dialogue", "speaker": "Meg", "text": "Igen, együtt élünk."}, {"type": "narration", "lang": "en", "text": "Anna and András join them. Meg can identify people, objects and family members."}, {"type": "dialogue", "speaker": "Károly", "text": "Ő Anna. Ő András."}, {"type": "dialogue", "speaker": "Meg", "text": "Ők a család."}, {"type": "dialogue", "speaker": "Anna", "text": "Mi ez?"}, {"type": "dialogue", "speaker": "Meg", "text": "Ez egy könyv."}, {"type": "narration", "lang": "en", "text": "There are several books and chairs. Meg can now recognise plurals."}, {"type": "dialogue", "speaker": "András", "text": "A könyvek és a székek itt vannak."}, {"type": "dialogue", "speaker": "Meg", "text": "A barátok is itt vannak."}, {"type": "narration", "lang": "en", "text": "Meg also understands simple possession."}, {"type": "dialogue", "speaker": "Károly", "text": "Ez a táskád?"}, {"type": "dialogue", "speaker": "Meg", "text": "Igen, a táska az enyém."}, {"type": "dialogue", "speaker": "Mariann", "text": "Ez a könyved?"}, {"type": "dialogue", "speaker": "Meg", "text": "Nem, a könyvem itt van."}, {"type": "narration", "lang": "en", "text": "The group continues speaking Hungarian. Meg no longer needs every short exchange translated."}, {"type": "dialogue", "speaker": "Meg", "text": "Igen. Értem."}], "narration": {"pedagogical": {"comprehensionQuestions": [{"question": "Kikkel találkozik Meg ebben az összefoglaló leckében?", "options": ["Idegen turistákkal a városban", "Károllyal, Annával, Andrással és Mariann-nal", "A dél-afrikai testvéreivel", "Csak a budapesti főbérlőjével"], "correctIndex": 1, "explanation": "Meg találkozik Károllyal és a baráti/családi körrel (Anna, András, Mariann) (Meg meets Károly, Anna, András, and Mariann)."}, {"question": "Mit árul el Károly a lakóhelyéről?", "options": ["Egyedül lakik egy kollégiumban", "Vidéken lakik a szüleinél", "Budapesten lakik, és együtt él Meggel", "Külföldre költözik a jövő héten"], "correctIndex": 2, "explanation": "Károly mondja: „Budapesten lakom. Veled élek”, Meg pedig megerősíti: „Igen, együtt élünk” (I live in Budapest. I live with you)."}, {"question": "Hogyan halad Meg a magyar nyelv tanulásával a szöveg szerint?", "options": ["Még semmit nem ért meg", "Már nem akar magyarul beszélni", "Csak angolul válaszol mindenkinek", "Már sok mindent megért, és nem kell mindent lefordítani neki"], "correctIndex": 3, "explanation": "A szöveg szerint Meg már nem igényel minden mondathoz fordítást: „Igen. Értem” (Meg understands most of it and no longer needs everything translated)."}]}}}}, "a1-unit-11": {"id": "story.a1.unit11", "title": "Where Things Are", "lesson": 55, "level": "A1", "script": "[Meg and Károly are at home in the flat. Meg looks around and describes where things and rooms are.]\n\nMeg: Ez a lakás szép és nagy. A nappali itt van.\nKároly: Igen, a szoba és a konyha is a lakásban van.\nMeg: Hol van a fürdőszoba és a hálószoba?\nKároly: A fürdőszoba itt van, a hálószoba ott van.\n[Meg looks out into the street and asks about places in town.]\n\nMeg: Hol van az iskola és az iroda?\nKároly: Az iskola az utcában van. Az iroda a házban van.\nMeg: És a bolt? A bolt is a házban van?\nKároly: Nem, a bolt az utcában van. A könyvtár és a park is ott van.\n[Meg looks around the room for her everyday things.]\n\nMeg: Hol van az asztal és a szék?\nKároly: Az asztal a szobában van. A szék is a szobában van.\nMeg: Itt van az ajtó és az ablak. De hol van a táska?\nKároly: A táska a nappaliban van.\n\n=== QUESTIONS ===\n\n1. Hol van a táska Károly szerint?\n  [ ] A konyhában van.\n  [x] A nappaliban van.\n  [ ] A hálószobában van.\n  [ ] A fürdőszobában van.\n  > Károly mondja: „A táska a nappaliban van.”\n\n2. Hol van az asztal és a szék?\n  [ ] Az utcában van.\n  [ ] A boltban van.\n  [x] A szobában van.\n  [ ] A parkban van.\n  > Károly mondja: „Az asztal a szobában van. A szék is a szobában van.”\n\n3. Hol van a bolt Károly szerint?\n  [x] Az utcában van.\n  [ ] A házban van.\n  [ ] A szobában van.\n  [ ] A lakásban van.\n  > Károly mondja: „Nem, a bolt az utcában van.”\n", "raw": {"id": "story.a1.unit11", "title": "Where Things Are", "level": "A1", "lesson": 55, "type": "original", "estimatedMinutes": 3, "characters": ["Károly", "Meg"], "paragraphs": [{"type": "narration", "lang": "en", "text": "Meg and Károly are at home in the flat. Meg looks around and describes where things and rooms are."}, {"type": "dialogue", "speaker": "Meg", "text": "Ez a lakás szép és nagy. A nappali itt van."}, {"type": "dialogue", "speaker": "Károly", "text": "Igen, a szoba és a konyha is a lakásban van."}, {"type": "dialogue", "speaker": "Meg", "text": "Hol van a fürdőszoba és a hálószoba?"}, {"type": "dialogue", "speaker": "Károly", "text": "A fürdőszoba itt van, a hálószoba ott van."}, {"type": "narration", "lang": "en", "text": "Meg looks out into the street and asks about places in town."}, {"type": "dialogue", "speaker": "Meg", "text": "Hol van az iskola és az iroda?"}, {"type": "dialogue", "speaker": "Károly", "text": "Az iskola az utcában van. Az iroda a házban van."}, {"type": "dialogue", "speaker": "Meg", "text": "És a bolt? A bolt is a házban van?"}, {"type": "dialogue", "speaker": "Károly", "text": "Nem, a bolt az utcában van. A könyvtár és a park is ott van."}, {"type": "narration", "lang": "en", "text": "Meg looks around the room for her everyday things."}, {"type": "dialogue", "speaker": "Meg", "text": "Hol van az asztal és a szék?"}, {"type": "dialogue", "speaker": "Károly", "text": "Az asztal a szobában van. A szék is a szobában van."}, {"type": "dialogue", "speaker": "Meg", "text": "Itt van az ajtó és az ablak. De hol van a táska?"}, {"type": "dialogue", "speaker": "Károly", "text": "A táska a nappaliban van."}], "narration": {"pedagogical": {"comprehensionQuestions": [{"question": "Hol van a táska Károly szerint?", "options": ["A konyhában van.", "A nappaliban van.", "A hálószobában van.", "A fürdőszobában van."], "correctIndex": 1, "explanation": "Károly mondja: „A táska a nappaliban van.”"}, {"question": "Hol van az asztal és a szék?", "options": ["Az utcában van.", "A boltban van.", "A szobában van.", "A parkban van."], "correctIndex": 2, "explanation": "Károly mondja: „Az asztal a szobában van. A szék is a szobában van.”"}, {"question": "Hol van a bolt Károly szerint?", "options": ["Az utcában van.", "A házban van.", "A szobában van.", "A lakásban van."], "correctIndex": 0, "explanation": "Károly mondja: „Nem, a bolt az utcában van.”"}]}}}}, "a1-unit-12": {"id": "story.a1.unit12", "title": "Going Somewhere", "lesson": 60, "level": "A1", "script": "[Meg and Károly leave the flat. They talk about destinations.]\n\nKároly: A busz az állomásra megy.\nMeg: A villamos a megállóba jön.\nKároly: A mozi mellett van a kávézó.\nMeg: Ma a kávézóba megyünk.\n[They pass several places in the city.]\n\nKároly: Az étterembe megyünk, nem a múzeumba.\nMeg: Az egyetem messze van a központtól.\nKároly: A munkahelyem a központban van.\nMeg: A posta a bank mellett van.\nKároly: A gyógyszertár az út mellett van.\n[They notice an entrance and an exit at the next building.]\n\nMeg: Hol van a bejárat?\nKároly: A bejárat itt van. A kijárat ott van.\nMeg: Ez a hely jó.\n[They continue towards the centre.]\n\nKároly: Megyünk a központba.\nMeg: Igen, a központba megyünk.\nKároly: A szó: menni.\nKároly: A szó: jönni.\n\n=== QUESTIONS ===\n\n1. Mit csinál Meg és Károly, amikor elhagyják a lakást?\n  [ ] Taxiba ülnek a repülőtérre menet\n  [ ] A könyvtárba sietnek tanulni\n  [x] Úticélokról beszélnek, miközben a központ felé tartanak\n  [ ] Egy múzeumi kiállítást néznek meg\n  > Meg és Károly elindulnak a központba, és útközben a városi helyszínekről és irányokról beszélgetnek (They walk towards the centre discussing urban destinations).\n\n2. Hová mennek ma a kávézó mellett?\n  [ ] A múzeumba\n  [x] Az étterembe\n  [ ] A moziba\n  [ ] A postára\n  > Károly mondja: „Az étterembe megyünk, nem a múzeumba” (We are going to the restaurant, not the museum).\n\n3. Hol van a bejárat a megfigyelt épületnél?\n  [x] Itt, a közelben van, miközben a kijárat amott van\n  [ ] Csak az udvar felől lehet bemenni\n  [ ] Zárva van a bejárat\n  [ ] Nincs bejárat az épületen\n  > Károly válasza Meg kérdésére: „A bejárat itt van. A kijárat ott van” (The entrance is here, the exit is there).\n", "raw": {"id": "story.a1.unit12", "title": "Going Somewhere", "level": "A1", "lesson": 60, "type": "original", "estimatedMinutes": 3, "characters": ["Károly", "Meg", "András", "Anna", "Mariann"], "paragraphs": [{"type": "narration", "lang": "en", "text": "Meg and Károly leave the flat. They talk about destinations."}, {"type": "dialogue", "speaker": "Károly", "text": "A busz az állomásra megy."}, {"type": "dialogue", "speaker": "Meg", "text": "A villamos a megállóba jön."}, {"type": "dialogue", "speaker": "Károly", "text": "A mozi mellett van a kávézó."}, {"type": "dialogue", "speaker": "Meg", "text": "Ma a kávézóba megyünk."}, {"type": "narration", "lang": "en", "text": "They pass several places in the city."}, {"type": "dialogue", "speaker": "Károly", "text": "Az étterembe megyünk, nem a múzeumba."}, {"type": "dialogue", "speaker": "Meg", "text": "Az egyetem messze van a központtól."}, {"type": "dialogue", "speaker": "Károly", "text": "A munkahelyem a központban van."}, {"type": "dialogue", "speaker": "Meg", "text": "A posta a bank mellett van."}, {"type": "dialogue", "speaker": "Károly", "text": "A gyógyszertár az út mellett van."}, {"type": "narration", "lang": "en", "text": "They notice an entrance and an exit at the next building."}, {"type": "dialogue", "speaker": "Meg", "text": "Hol van a bejárat?"}, {"type": "dialogue", "speaker": "Károly", "text": "A bejárat itt van. A kijárat ott van."}, {"type": "dialogue", "speaker": "Meg", "text": "Ez a hely jó."}, {"type": "narration", "lang": "en", "text": "They continue towards the centre."}, {"type": "dialogue", "speaker": "Károly", "text": "Megyünk a központba."}, {"type": "dialogue", "speaker": "Meg", "text": "Igen, a központba megyünk."}, {"type": "dialogue", "speaker": "Károly", "text": "A szó: menni."}, {"type": "dialogue", "speaker": "Károly", "text": "A szó: jönni."}], "narration": {"pedagogical": {"comprehensionQuestions": [{"question": "Mit csinál Meg és Károly, amikor elhagyják a lakást?", "options": ["Taxiba ülnek a repülőtérre menet", "A könyvtárba sietnek tanulni", "Úticélokról beszélnek, miközben a központ felé tartanak", "Egy múzeumi kiállítást néznek meg"], "correctIndex": 2, "explanation": "Meg és Károly elindulnak a központba, és útközben a városi helyszínekről és irányokról beszélgetnek (They walk towards the centre discussing urban destinations)."}, {"question": "Hová mennek ma a kávézó mellett?", "options": ["A múzeumba", "Az étterembe", "A moziba", "A postára"], "correctIndex": 1, "explanation": "Károly mondja: „Az étterembe megyünk, nem a múzeumba” (We are going to the restaurant, not the museum)."}, {"question": "Hol van a bejárat a megfigyelt épületnél?", "options": ["Itt, a közelben van, miközben a kijárat amott van", "Csak az udvar felől lehet bemenni", "Zárva van a bejárat", "Nincs bejárat az épületen"], "correctIndex": 0, "explanation": "Károly válasza Meg kérdésére: „A bejárat itt van. A kijárat ott van” (The entrance is here, the exit is there)."}]}}}}, "a1-unit-13": {"id": "story.a1.unit13", "title": "What You Do", "lesson": 65, "level": "A1", "script": "[Károly and Meg talk about what they do during the day.]\n\nKároly: Dolgozom és tanulok.\nMeg: Olvasok és írok.\nKároly: András magyarul beszél.\nMeg: Anna angolul beszél és hallgat.\n[They describe ordinary activities.]\n\nKároly: Este filmet nézek.\nMeg: Reggel eszem és iszom.\nKároly: Éjjel alszom.\nMeg: Károly főz.\nKároly: Meg vesz egy könyvet.\n[Meg looks for her phone while Károly waits.]\n\nMeg: Keresem a telefonomat.\nKároly: Várok.\nMeg: Utána sétálunk.\nKároly: A gyerekek játszanak.\n[András works as a schoolteacher, and Mariann teaches Hungarian to newcomers like Meg.]\n\nMeg: Mariann tanít.\nKároly: András is tanít.\nKároly: Meg kérdez.\nMeg: Én válaszolok.\n\n=== QUESTIONS ===\n\n1. Milyen tevékenységekről beszélget Meg és Károly?\n  [ ] Csak a hétvégi sportmeccsekről\n  [x] Hétköznapi cselekvésekről: munkáról, tanulásról, olvasásról és evésről\n  [ ] Egy új autó vezetéséről\n  [ ] Egy esküvő szervezéséről\n  > A szereplők a mindennapi teendőiket és cselekvéseiket sorolják fel (They describe everyday activities: working, studying, reading, and eating).\n\n2. Mit csinál Károly este a történet szerint?\n  [x] Filmet néz\n  [ ] Zenét hallgat\n  [ ] Autót szerel\n  [ ] Kocogni megy\n  > Károly mondja: „Este filmet nézek” (In the evening I watch a movie).\n\n3. Mit csinál Mariann és András a szöveg alapján?\n  [ ] Egy étteremben főznek\n  [ ] Filmet rendeznek\n  [ ] Irodában dolgoznak számítógépen\n  [x] Mindketten tanítanak\n  > Meg mondja: „Mariann tanít”, Károly pedig: „András is tanít” (Both Mariann and András teach).\n", "raw": {"id": "story.a1.unit13", "title": "What You Do", "level": "A1", "lesson": 65, "type": "original", "estimatedMinutes": 3, "characters": ["Károly", "Meg", "András", "Anna", "Mariann"], "paragraphs": [{"type": "narration", "lang": "en", "text": "Károly and Meg talk about what they do during the day."}, {"type": "dialogue", "speaker": "Károly", "text": "Dolgozom és tanulok."}, {"type": "dialogue", "speaker": "Meg", "text": "Olvasok és írok."}, {"type": "dialogue", "speaker": "Károly", "text": "András magyarul beszél."}, {"type": "dialogue", "speaker": "Meg", "text": "Anna angolul beszél és hallgat."}, {"type": "narration", "lang": "en", "text": "They describe ordinary activities."}, {"type": "dialogue", "speaker": "Károly", "text": "Este filmet nézek."}, {"type": "dialogue", "speaker": "Meg", "text": "Reggel eszem és iszom."}, {"type": "dialogue", "speaker": "Károly", "text": "Éjjel alszom."}, {"type": "dialogue", "speaker": "Meg", "text": "Károly főz."}, {"type": "dialogue", "speaker": "Károly", "text": "Meg vesz egy könyvet."}, {"type": "narration", "lang": "en", "text": "Meg looks for her phone while Károly waits."}, {"type": "dialogue", "speaker": "Meg", "text": "Keresem a telefonomat."}, {"type": "dialogue", "speaker": "Károly", "text": "Várok."}, {"type": "dialogue", "speaker": "Meg", "text": "Utána sétálunk."}, {"type": "dialogue", "speaker": "Károly", "text": "A gyerekek játszanak."}, {"type": "narration", "lang": "en", "text": "András works as a schoolteacher, and Mariann teaches Hungarian to newcomers like Meg."}, {"type": "dialogue", "speaker": "Meg", "text": "Mariann tanít."}, {"type": "dialogue", "speaker": "Károly", "text": "András is tanít."}, {"type": "dialogue", "speaker": "Károly", "text": "Meg kérdez."}, {"type": "dialogue", "speaker": "Meg", "text": "Én válaszolok."}], "narration": {"pedagogical": {"comprehensionQuestions": [{"question": "Milyen tevékenységekről beszélget Meg és Károly?", "options": ["Csak a hétvégi sportmeccsekről", "Hétköznapi cselekvésekről: munkáról, tanulásról, olvasásról és evésről", "Egy új autó vezetéséről", "Egy esküvő szervezéséről"], "correctIndex": 1, "explanation": "A szereplők a mindennapi teendőiket és cselekvéseiket sorolják fel (They describe everyday activities: working, studying, reading, and eating)."}, {"question": "Mit csinál Károly este a történet szerint?", "options": ["Filmet néz", "Zenét hallgat", "Autót szerel", "Kocogni megy"], "correctIndex": 0, "explanation": "Károly mondja: „Este filmet nézek” (In the evening I watch a movie)."}, {"question": "Mit csinál Mariann és András a szöveg alapján?", "options": ["Egy étteremben főznek", "Filmet rendeznek", "Irodában dolgoznak számítógépen", "Mindketten tanítanak"], "correctIndex": 3, "explanation": "Meg mondja: „Mariann tanít”, Károly pedig: „András is tanít” (Both Mariann and András teach)."}]}}}}, "a1-unit-14": {"id": "story.a1.unit14", "title": "Saying No & Asking Questions", "lesson": 70, "level": "A1", "script": "[A small misunderstanding gives Meg a chance to ask questions and say no.]\n\nMariann: Dolgozol ma?\nMeg: Nem dolgozom.\nKároly: Igaz?\nMeg: Persze. Igaz.\n[They check the details carefully.]\n\nKároly: Tényleg nem dolgozol?\nMeg: Igen. Most nem dolgozom.\nMariann: Miért?\nMeg: Mert tanulok.\nKároly: Hogyan tanulsz?\nMeg: Otthon.\n[Meg does not understand one question.]\n\nMeg: Nem értem.\nMariann: Nem baj. Ez egy kérdés.\nMeg: A válasz most egyszerű.\nKároly: Melyik válasz?\nMeg: Ez a válasz.\nKároly: Valaki kérdez?\nMeg: Igen, valaki kérdez. Senki nem haragszik.\nMariann: Van valami más?\nMeg: Nem, semmi.\n\n=== QUESTIONS ===\n\n1. Milyen nyelvi fordulatokat gyakorol Meg ebben a beszélgetésben?\n  [ ] Csak a múlt idő használatát\n  [ ] A hivatalos levélírást\n  [ ] Az árak kérdezését a piacon\n  [x] A nemet mondást és a kérdések megválaszolását\n  > A lecke témája a tagadás („nem dolgozom”) és a kérdések megértése és megválaszolása (Practising saying no and answering questions).\n\n2. Miért nem dolgozik Meg aznap?\n  [x] Mert tanul\n  [ ] Mert fáradt\n  [ ] Mert moziba megy\n  [ ] Mert beteg\n  > Mariann kérdésére („Miért?”) Meg ezt feleli: „Mert tanulok” (Because I am studying).\n\n3. Hol tanul Meg Károly kérdésére válaszolva?\n  [ ] A könyvtárban\n  [ ] Az egyetemen\n  [x] Otthon\n  [ ] Egy kávézó teraszán\n  > Károly kérdésére („Hogyan tanulsz?”) Meg válasza: „Otthon” (At home).\n", "raw": {"id": "story.a1.unit14", "title": "Saying No & Asking Questions", "level": "A1", "lesson": 70, "type": "original", "estimatedMinutes": 3, "characters": ["Károly", "Meg", "András", "Anna", "Mariann"], "paragraphs": [{"type": "narration", "lang": "en", "text": "A small misunderstanding gives Meg a chance to ask questions and say no."}, {"type": "dialogue", "speaker": "Mariann", "text": "Dolgozol ma?"}, {"type": "dialogue", "speaker": "Meg", "text": "Nem dolgozom."}, {"type": "dialogue", "speaker": "Károly", "text": "Igaz?"}, {"type": "dialogue", "speaker": "Meg", "text": "Persze. Igaz."}, {"type": "narration", "lang": "en", "text": "They check the details carefully."}, {"type": "dialogue", "speaker": "Károly", "text": "Tényleg nem dolgozol?"}, {"type": "dialogue", "speaker": "Meg", "text": "Igen. Most nem dolgozom."}, {"type": "dialogue", "speaker": "Mariann", "text": "Miért?"}, {"type": "dialogue", "speaker": "Meg", "text": "Mert tanulok."}, {"type": "dialogue", "speaker": "Károly", "text": "Hogyan tanulsz?"}, {"type": "dialogue", "speaker": "Meg", "text": "Otthon."}, {"type": "narration", "lang": "en", "text": "Meg does not understand one question."}, {"type": "dialogue", "speaker": "Meg", "text": "Nem értem."}, {"type": "dialogue", "speaker": "Mariann", "text": "Nem baj. Ez egy kérdés."}, {"type": "dialogue", "speaker": "Meg", "text": "A válasz most egyszerű."}, {"type": "dialogue", "speaker": "Károly", "text": "Melyik válasz?"}, {"type": "dialogue", "speaker": "Meg", "text": "Ez a válasz."}, {"t
