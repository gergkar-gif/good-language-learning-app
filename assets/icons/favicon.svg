<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
    <!-- Same mark as the Home nav icon (engine/art.js ICONS.home) — a door
         standing open, the shape the app is named for — on the app's own
         navy/cream/accent palette so the tab icon reads as Parlour at a
         glance rather than a generic bookmark. -->
    <rect width="24" height="24" rx="5" fill="#17365B"/>
    <rect x="4" y="3" width="16" height="18" fill="none" stroke="#F5F1E8" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M4 3 12 6v15l-8-3Z" fill="none" stroke="#F5F1E8" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="10" cy="12" r="1.1" fill="#DC4E2E"/>
</svg>
